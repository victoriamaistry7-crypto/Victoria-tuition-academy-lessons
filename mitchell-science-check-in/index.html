<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#12182d">
<title>Victoria Tuition Academy • Student Check-In</title>
<style>
:root{--bg:#f6f7fb;--card:#fff;--ink:#172036;--muted:#687187;--line:#e3e7ef;--a:#5b5cf0;--a2:#7c3aed;--good:#16784a;--bad:#b73d49;--warn:#9b6816}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink)}
body{padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}button,input,select,textarea{font:inherit}
.app{max-width:620px;margin:auto;min-height:100vh}.top{position:sticky;top:0;z-index:30;background:rgba(246,247,251,.95);backdrop-filter:blur(12px);border-bottom:1px solid rgba(227,231,239,.9);padding:11px 14px 9px}
.brand{display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:11px;font-weight:900;color:#626b80;text-transform:uppercase;letter-spacing:.05em}.track{height:7px;background:#e6e8f0;border-radius:999px;margin-top:8px;overflow:hidden}.fill{height:100%;width:0;background:linear-gradient(90deg,var(--a),var(--a2));transition:.25s}
.shell{padding:16px 14px 108px}.card{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:22px 18px;box-shadow:0 12px 35px rgba(28,37,66,.055)}.hero{background:linear-gradient(145deg,#151b31,#3d43bc 58%,#7739dc);color:#fff;border:0}.hero p{color:rgba(255,255,255,.85)}
.badge{display:inline-flex;padding:7px 10px;border-radius:999px;background:#eef0ff;color:#4449bc;font-size:11px;font-weight:900;margin-bottom:13px}.hero .badge{background:rgba(255,255,255,.14);color:#fff;border:1px solid rgba(255,255,255,.15)}
.kicker{font-size:11px;font-weight:950;letter-spacing:.09em;text-transform:uppercase;color:var(--a);margin-bottom:9px}h1{font-size:34px;line-height:1.03;letter-spacing:-.04em;margin:0 0 12px}h2{font-size:25px;line-height:1.14;letter-spacing:-.025em;margin:0 0 9px}h3{font-size:16px;margin:22px 0 8px}p{margin:0;color:var(--muted);line-height:1.55}
label{display:block;font-size:13px;font-weight:850;margin:15px 0 7px}.hint{font-size:12px;color:#7a8396;margin-top:6px;line-height:1.45}
input[type=text],input[type=date],input[type=time],input[type=password],select,textarea{width:100%;border:1px solid var(--line);border-radius:14px;padding:13px;background:#fff;color:var(--ink);outline:none}
textarea{min-height:105px;resize:vertical}input:focus,select:focus,textarea:focus{border-color:#7b7df5;box-shadow:0 0 0 3px rgba(91,92,240,.11)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.choices{display:grid;gap:9px;margin-top:14px}.choices.two{grid-template-columns:1fr 1fr}.choice{width:100%;min-height:56px;border:1px solid var(--line);background:#fff;border-radius:15px;padding:12px 13px;text-align:left;color:var(--ink);font-weight:800;line-height:1.35}.choice.selected{border-color:#696bf3;background:#f0f1ff;box-shadow:0 0 0 2px rgba(91,92,240,.08)}.choice:disabled{opacity:.82;cursor:not-allowed}
.topicCard{border:1px solid var(--line);border-radius:16px;padding:13px;margin-top:10px;background:#fbfcfe}.topicCard b{display:block;margin-bottom:4px}.topicCard span{font-size:12px;color:var(--muted)}
.qnum{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}.pill{font-size:11px;font-weight:900;padding:6px 9px;border-radius:999px;background:#f0f1f6;color:#555e72}.svgbox{margin:15px 0;border:1px solid var(--line);background:#fafbfe;border-radius:17px;padding:10px;overflow:hidden}
.work{margin-top:14px}.work textarea{min-height:86px}.feedback{margin-top:14px;border-radius:15px;padding:13px;line-height:1.5;font-size:14px}.feedback.good{background:#eef9f3;border:1px solid #ccebdd;color:#135e3b}.feedback.bad{background:#fff3f4;border:1px solid #f1cbd0;color:#842d37}.feedback b{display:block;margin-bottom:4px}.correctline{margin-top:7px;font-weight:850}.memo{margin-top:7px}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:40;background:rgba(255,255,255,.97);backdrop-filter:blur(12px);border-top:1px solid var(--line);padding:10px 14px calc(10px + env(safe-area-inset-bottom))}.navin{max-width:620px;margin:auto;display:grid;grid-template-columns:1fr 1.55fr;gap:9px}.nav button,.primary,.secondary{min-height:52px;border:0;border-radius:15px;font-weight:900}.back{background:#eef0f5;color:#35405b}.next,.primary{background:linear-gradient(135deg,var(--a),var(--a2));color:#fff}.next:disabled{opacity:.4}.secondary{background:#eef0f5;color:#35405b}
.metric{background:#f8f9fc;border:1px solid var(--line);border-radius:15px;padding:12px;margin:8px 0}.metric small{display:block;color:var(--muted);font-weight:750;margin-bottom:4px}.metric b{font-size:16px}.score{font-size:52px;font-weight:950;letter-spacing:-.05em}.barrow{margin:12px 0}.barhead{display:flex;justify-content:space-between;gap:10px;font-size:12px;font-weight:850;margin-bottom:5px}.bar{height:8px;background:#e9ebf2;border-radius:99px;overflow:hidden}.bar i{height:100%;display:block;background:linear-gradient(90deg,var(--a),var(--a2))}
.flag{border:1px solid #f0deac;background:#fff9e9;border-radius:14px;padding:11px 12px;margin:8px 0;font-size:13px;line-height:1.45}.qreview{border:1px solid var(--line);border-radius:15px;padding:12px;margin:9px 0}.qreview.ok{border-left:4px solid var(--good)}.qreview.no{border-left:4px solid var(--bad)}.qreview small{display:block;color:var(--muted);margin-top:5px;line-height:1.45}
.share{display:grid;gap:9px;margin-top:18px}.share button{min-height:52px;border:0;border-radius:15px;font-weight:900}.lock{max-width:480px;margin:9vh auto 0}.lock .card{padding:26px 20px}.lockerr{display:none;color:var(--bad);font-size:13px;font-weight:800;margin-top:9px}.tiny{font-size:11px;color:#8a91a2;line-height:1.45;margin-top:12px}
.toast{position:fixed;left:50%;bottom:92px;transform:translateX(-50%);background:#172036;color:#fff;padding:10px 14px;border-radius:999px;font-size:12px;font-weight:850;opacity:0;pointer-events:none;transition:.2s;z-index:60}.toast.show{opacity:1}
.reportMode .nav,.reportMode .top{display:none}.reportMode .shell{padding-top:22px;padding-bottom:40px}
@media(max-width:420px){h1{font-size:30px}.card{border-radius:20px}.grid2,.choices.two{grid-template-columns:1fr}.shell{padding-left:11px;padding-right:11px}}
</style>
</head>

{id:"f2",d:1,type:"num",skill:"calculation",q:"A 6 kg object is on Earth. Use g = 10 N/kg. Calculate its weight.",a:60,tol:.01,unit:"N",m:"Weight = mass × gravitational field strength = 6 × 10 = 60 N."},

"Resistance":{sub:["What resistance means","Uses of resistors","Length of conductor","Thickness of conductor","Material & temperature"],qs:[

{id:"r2",d:1,type:"mcq",skill:"application",q:"Which wire usually has MORE resistance if everything else is the same?",o:["A shorter wire","A longer wire","A thicker wire","They must be equal"],a:1,m:"A longer conductor generally has greater resistance because charges travel through more material and experience more collisions."},
{id:"r3",d:2,type:"mcq",skill:"application",q:"Two wires are made from the same material and have the same length. Which normally has less resistance?",o:["The thinner wire","The thicker wire","Both always have zero resistance","Thickness does not matter"],a:1,m:"A thicker conductor provides more pathways for charge and therefore normally has lower resistance."},
{id:"r4",d:3,type:"num",skill:"calculation",q:"A component has a potential difference of 6 V and a current of 2 A. Using R = V ÷ I, calculate its resistance.",a:3,tol:.01,unit:"Ω",m:"R = V ÷ I = 6 ÷ 2 = 3 Ω."},
{id:"r5",d:3,type:"mcq",skill:"investigation",q:"To investigate how wire length affects resistance, which pair must definitely be kept the same?",o:["Length and current","Material and thickness","Length and voltage","Resistance and length"],a:1,m:"Length is changed. Material and thickness must be controlled so they do not also affect resistance."}]},
"Series & parallel circuits":{sub:["Identify circuit type","Current in series","Potential difference in series","Current in parallel","Potential difference in parallel"],qs:[
{id:"s1",d:1,type:"mcq",skill:"concept",q:"In a simple series circuit, the current measured at different points is:",o:["Different everywhere","The same at every point","Always zero","Largest near the battery only"],a:1,m:"A series circuit has one path, so the same current flows through each component."},
{id:"s2",d:2,type:"num",skill:"calculation",q:"A 9 V battery is connected to two resistors in series. The potential difference across the first resistor is 4 V. What is the potential difference across the second resistor?",a:5,tol:.01,unit:"V",m:"In series, the potential differences across components add to the battery potential difference. 9 V − 4 V = 5 V."},
{id:"s3",d:2,type:"mcq",skill:"application",q:"Two bulbs are on separate parallel branches. One bulb is removed. What happens to the other?",o:["It must go off","It can remain on because its branch is still complete","It becomes disconnected from the battery","The battery voltage becomes zero"],a:1,m:"Parallel branches provide independent paths. Removing one branch does not necessarily break the other branch."},
{id:"s4",d:3,type:"mcq",skill:"reasoning",q:"Three identical cells are connected in parallel. Compared with one cell, the potential difference across the combination is approximately:",o:["Three times larger","The same as one cell","Zero","Half as large"],a:1,m:"Identical cells connected in parallel provide approximately the same potential difference as one cell; parallel connection mainly affects how long the supply can deliver current."},
{id:"s5",d:3,type:"mcq",skill:"exam reasoning",q:"A learner adds another resistor in series. What generally happens to total resistance and current?",o:["Resistance decreases; current increases","Resistance increases; current decreases","Both stay exactly the same","Resistance becomes zero"],a:1,m:"Adding resistance in series increases total resistance. For the same supply voltage, the current decreases."}]},

{id:"e1",d:1,type:"mcq",skill:"safety",q:"What is the purpose of a fuse or circuit breaker?",o:["To increase voltage","To interrupt the circuit if current becomes dangerously high","To make appliances use more energy","To store electric charge"],a:1,m:"Fuses and circuit breakers protect wiring/appliances by breaking the circuit when the current is unsafe."},
{id:"e2",d:2,type:"mcq",skill:"safety",q:"Why is an earth wire important in a metal-cased appliance?",o:["It normally carries the working current","It provides a low-resistance safety path if the metal case becomes live","It increases resistance of the appliance","It replaces the live wire"],a:1,m:"The earth wire provides a safety path to ground so a fault current can flow and protection can disconnect the supply."},
{id:"e3",d:2,type:"num",skill:"calculation",q:"A 2 kW heater runs for 3 hours. How much electrical energy does it use?",a:6,tol:.01,unit:"kWh",m:"Energy used = power × time = 2 kW × 3 h = 6 kWh."},
{id:"e4",d:3,type:"num",skill:"calculation",q:"Electricity costs R3.00 per kWh. A device uses 4.5 kWh. What does this energy cost?",a:13.5,tol:.01,unit:"R",m:"Cost = energy × tariff = 4.5 × R3.00 = R13.50."},

{id:"p2",d:2,type:"mcq",skill:"application",q:"Plant roots grow through soil while taking up water and exchanging gases. Which idea does this best show?",o:["Earth's spheres interact with one another","Only the biosphere matters","The hydrosphere cannot interact with soil","The atmosphere is separate from life"],a:0,m:"The example links the biosphere (plant), lithosphere (soil), hydrosphere (water) and atmosphere (gases)."},
{id:"p3",d:2,type:"mcq",skill:"sequence",q:"Which process turns sediments into sedimentary rock?",o:["Melting only","Compaction and cementation","Evaporation into magma","Nuclear fusion"],a:1,m:"Sediments are deposited, compacted and cemented to form sedimentary rock."},
{id:"p4",d:3,type:"mcq",skill:"reasoning",q:"Which is a direct environmental concern linked to some mining activities?",o:["Creation of mine dumps and possible water pollution","Formation of new stars","Removal of gravity","Stopping the rock cycle everywhere"],a:0,m:"Mining can create mine dumps, disturb habitats and contribute to water pollution, among other impacts."},

};

const state=JSON.parse(localStorage.getItem("vtaStudentCheckV3")||'{"step":0,"intake":{},"locked":{},"answers":{},"work":{},"feedback":{},"started":0}');
let selectedFile=null;
function save(){localStorage.setItem("vtaStudentCheckV3",JSON.stringify(state))}
function esc(v){return String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
function sha256(s){return crypto.subtle.digest("SHA-256",new TextEncoder().encode(s)).then(b=>[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join(""))}
function showToast(x){const t=document.getElementById("toast");t.textContent=x;t.classList.add("show");setTimeout(()=>t.classList.remove("show"),2300)}
function makeSlots(conf,bank){const want=conf==="okay"?[2,3,3,3,3]:conf==="struggle"?[1,1,2,2,3]:[1,2,2,3,3];const used=[];want.forEach(d=>{let q=bank.find(x=>x.d===d&&!used.includes(x));if(!q)q=bank.find(x=>!used.includes(x));if(q)used.push(q)});return used.slice(0,5)}
function reportPayload(){
 const qset=state.qset||[];let right=0;const skills={};const reviews=[];
 qset.forEach(q=>{const a=state.answers[q.id],correct=q.type==="num"?Math.abs(Number(a)-Number(q.a))<=q.tol:Number(a)===q.a;if(correct)right++;skills[q.skill]??={r:0,n:0};skills[q.skill].n++;if(correct)skills[q.skill].r++;reviews.push({id:q.id,q:q.q,correct,answer:a,correctAnswer:q.type==="num"?q.a+" "+q.unit:q.o[q.a],working:state.work[q.id]||"",memo:q.m})});
 const sk=Object.entries(skills).map(([k,v])=>({skill:k,pct:Math.round(v.r/v.n*100)})).sort((a,b)=>a.pct-b.pct);
 return {version:3,name:state.intake.name||"Student",grade:state.intake.grade||"9",curriculum:state.intake.curriculum||"Not sure",mode:state.intake.mode||"",duration:state.intake.duration||"",date1:state.intake.date1||"",time1:state.intake.time1||"",date2:state.intake.date2||"",time2:state.intake.time2||"",topic:state.intake.topic||"",subtopic:state.intake.subtopic||"",confidence:state.intake.confidence||"",issue:state.intake.issue||"",testDate:state.intake.testDate||"",materialName:state.intake.materialName||"",score:right,total:qset.length,pct:qset.length?Math.round(right/qset.length*100):0,weakestSkill:sk[0]?.skill||"—",reviews,submitted:new Date().toISOString()}
}
function b64obj(o){const bytes=new TextEncoder().encode(JSON.stringify(o));let bin="";bytes.forEach(b=>bin+=String.fromCharCode(b));return btoa(bin).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"")}
function unb64(s){s=s.replace(/-/g,"+").replace(/_/g,"/");while(s.length%4)s+="=";const bin=atob(s),bytes=Uint8Array.from(bin,c=>c.charCodeAt(0));return JSON.parse(new TextDecoder().decode(bytes))}
function reportText(r){
 return "VICTORIA TUITION ACADEMY — STUDENT CHECK-IN\n\nStudent: "+r.name+" | Grade "+r.grade+" | "+r.curriculum+"\nRequested: "+r.topic+(r.subtopic?" — "+r.subtopic:"")+"\nConfidence: "+r.confidence+"\nStudent says: "+r.issue+"\nUpcoming test: "+(r.testDate||"Not given")+"\n\nLESSON REQUEST\n1st choice: "+(r.date1||"—")+" at "+(r.time1||"—")+"\n2nd choice: "+(r.date2||"—")+" at "+(r.time2||"—")+"\nMode: "+r.mode+" | Duration: "+r.duration+"\nMaterial attached/selected: "+(r.materialName||"No")+"\n\nDIAGNOSTIC\nScore: "+r.score+"/"+r.total+" ("+r.pct+"%)\nWeakest skill pattern: "+r.weakestSkill+"\n\nQUESTION REVIEW\n"+r.reviews.map((x,i)=>(i+1)+". "+(x.correct?"CORRECT":"NEEDS WORK")+" — "+x.q+"\nAnswer: "+x.answer+"\nWorking: "+(x.working||"No working entered")+(x.correct?"":"\nCorrect: "+x.correctAnswer+"\nMemo: "+x.memo)).join("\n\n");
}

function rootShell(){
 document.getElementById("root").innerHTML='<div class="app"><div class="top"><div class="brand"><span>Victoria Tuition Academy</span><span id="stepLabel">Student Check-In</span></div><div class="track"><div class="fill" id="fill"></div></div></div><main class="shell"><section class="card" id="card"></section></main><div class="nav" id="nav"><div class="navin"><button class="back" id="back">Back</button><button class="next" id="next">Continue</button></div></div></div>';
 document.getElementById("back").onclick=back;document.getElementById("next").onclick=next;

function renderGate(){
 document.getElementById("root").innerHTML='<div class="app lock"><main class="shell"><section class="card hero"><div class="badge">Private student page</div><h1>Victoria Tuition Academy</h1><p>Enter the access password provided by your tutor.</p><label style="color:#fff">Password</label><input id="pw" type="password" autocomplete="current-password" placeholder="Enter password"><button class="primary" id="unlock" style="width:100%;margin-top:12px">Open student check-in</button><div class="lockerr" id="lockerr">That password is not correct.</div><div class="tiny" style="color:rgba(255,255,255,.7)">This access gate prevents casual opening of the page. Do not share the password publicly.</div></section></main></div>';
 const go=async()=>{const h=await sha256(ACCESS_SALT+":"+document.getElementById("pw").value);if(h===ACCESS_HASH){sessionStorage.setItem("vta_check_access","1");boot()}else document.getElementById("lockerr").style.display="block"};
 document.getElementById("unlock").onclick=go;document.getElementById("pw").onkeydown=e=>{if(e.key==="Enter")go()};

function totalSteps(){return 5+(state.qset?.length||5)+1}
function setProgress(){const f=document.getElementById("fill");if(!f)return;const max=totalSteps()-1;f.style.width=Math.min(100,state.step/max*100)+"%";document.getElementById("stepLabel").textContent=state.step===0?"Student Check-In":"Step "+state.step+" of "+max}
function next(){if(state.step===0){state.step=1;state.started=Date.now()}else if(state.step===1){readSchedule();state.step=2}else if(state.step===2){readLearning();buildQset();state.step=3}else if(state.step===3){state.step=4}else{const qi=state.step-4;if(qi>=0&&qi<(state.qset||[]).length){if(!state.locked[state.qset[qi].id]){gradeCurrent();return}state.step++}else state.step++}save();render();window.scrollTo({top:0,behavior:"smooth"})}
function back(){if(state.step===0)return;if(state.step>=4&&state.step<4+(state.qset?.length||0)){const q=state.qset[state.step-4];if(state.locked[q.id]){showToast("Submitted answers are locked.");return}}state.step=Math.max(0,state.step-1);save();render();window.scrollTo({top:0,behavior:"smooth"})}
function render(){
 setProgress();const c=document.getElementById("card"),n=document.getElementById("next"),b=document.getElementById("back"),nav=document.getElementById("nav");b.style.visibility=state.step===0?"hidden":"visible";nav.style.display="block";c.className="card";
 if(state.step===0){c.className="card hero";c.innerHTML='<div class="badge">Grade 9 Natural Sciences • Mobile check-in</div><h1>Plan the lesson. Find the gap. Fix it.</h1><p>Choose when you would like a lesson, tell Victoria exactly what you need help with, then complete a short diagnostic built around that topic.</p>';n.textContent="Start";n.disabled=false;return}
 if(state.step===1){renderSchedule(c,n);return}
 if(state.step===2){renderLearning(c,n);return}
 if(state.step===3){renderReady(c,n);return}
 const qi=state.step-4;if(qi>=0&&qi<(state.qset||[]).length){renderQuestion(c,n,state.qset[qi],qi);return}
 renderResults(c);nav.style.display="none";
}
function renderSchedule(c,n){
 const i=state.intake;c.innerHTML='<div class="kicker">Lesson request</div><h2>When would you like your lesson?</h2><p>Give Victoria two options so scheduling is easier.</p>'+
 '<label>Your name</label><input id="name" type="text" value="'+esc(i.name||"Mitchell")+'" placeholder="Student name">'+
 '<div class="grid2"><div><label>Grade</label><select id="grade"><option '+((i.grade||"9")==="9"?"selected":"")+'>9</option><option '+(i.grade==="8"?"selected":"")+'>8</option><option '+(i.grade==="10"?"selected":"")+'>10</option><option '+(i.grade==="11"?"selected":"")+'>11</option><option '+(i.grade==="12"?"selected":"")+'>12</option></select></div><div><label>Curriculum</label><select id="curriculum">'+["IEB","CAPS","Not sure"].map(x=>'<option '+(i.curriculum===x?"selected":"")+'>'+x+'</option>').join("")+'</select></div></div>'+
 '<div class="grid2"><div><label>1st choice date</label><input id="date1" type="date" value="'+esc(i.date1||"")+'"></div><div><label>Time</label><input id="time1" type="time" value="'+esc(i.time1||"15:30")+'"></div></div>'+
 '<div class="grid2"><div><label>2nd choice date</label><input id="date2" type="date" value="'+esc(i.date2||"")+'"></div><div><label>Time</label><input id="time2" type="time" value="'+esc(i.time2||"15:30")+'"></div></div>'+
 '<div class="grid2"><div><label>Lesson format</label><select id="mode">'+["Online","In person","Either"].map(x=>'<option '+(i.mode===x?"selected":"")+'>'+x+'</option>').join("")+'</select></div><div><label>Duration</label><select id="duration">'+["1 hour","2 hours"].map(x=>'<option '+(i.duration===x?"selected":"")+'>'+x+'</option>').join("")+'</select></div></div>';
 n.textContent="Choose what to cover";n.disabled=false;const today=new Date().toISOString().slice(0,10);["date1","date2"].forEach(id=>document.getElementById(id).min=today);
}
function readSchedule(){["name","grade","curriculum","date1","time1","date2","time2","mode","duration"].forEach(id=>state.intake[id]=document.getElementById(id).value)}
function renderLearning(c,n){
 const i=state.intake,keys=[...Object.keys(topics),extraTopic];c.innerHTML='<div class="kicker">Lesson focus</div><h2>What do you want us to work on?</h2><p>Be specific. The short diagnostic afterwards changes depending on what you choose.</p>'+
 '<label>Topic</label><select id="topic"><option value="">Choose a topic</option>'+keys.map(x=>'<option '+(i.topic===x?"selected":"")+'>'+x+'</option>').join("")+'</select>'+
 '<div id="subwrap"></div><label>How do you feel about this topic?</label><div class="choices" id="confChoices">'+[["struggle","I struggle — start from the basics"],["unsure","I am not sure — test what I actually know"],["okay","I think I am okay — give me exam-level questions"]].map(x=>'<button type="button" class="choice '+(i.confidence===x[0]?"selected":"")+'" data-v="'+x[0]+'">'+x[1]+'</button>').join("")+'</div>'+
 '<label>What exactly is confusing or difficult?</label><textarea id="issue" placeholder="Example: I understand series circuits but I get confused with voltage readings and exam questions.">'+esc(i.issue||"")+'</textarea>'+
 '<label>When is your next test/exam? <span style="font-weight:500;color:#8a91a2">(optional)</span></label><input id="testDate" type="date" value="'+esc(i.testDate||"")+'">'+
 '<label>Upload a scope, test, worksheet or past paper <span style="font-weight:500;color:#8a91a2">(optional)</span></label><input id="material" type="file" accept="image/*,.pdf"><div class="hint">On supported phones, this file can be shared with the tutor together with your final report.</div>';
 const topicEl=document.getElementById("topic"),sub=document.getElementById("subwrap");
 const drawSub=()=>{const t=topicEl.value;if(topics[t])sub.innerHTML='<label>Which part?</label><select id="subtopic"><option value="">Not sure / whole topic</option>'+topics[t].sub.map(x=>'<option '+(i.subtopic===x?"selected":"")+'>'+x+'</option>').join("")+'</select>';else sub.innerHTML='<label>Type the exact topic</label><input id="subtopic" type="text" value="'+esc(i.subtopic||"")+'" placeholder="Type the school topic here">'};drawSub();topicEl.onchange=()=>{i.subtopic="";drawSub()};
 document.querySelectorAll("#confChoices .choice").forEach(btn=>btn.onclick=()=>{i.confidence=btn.dataset.v;document.querySelectorAll("#confChoices .choice").forEach(x=>x.classList.toggle("selected",x===btn));setLearningNext()});
 document.getElementById("material").onchange=e=>{selectedFile=e.target.files[0]||null;i.materialName=selectedFile?.name||""};n.textContent="Build my diagnostic";setLearningNext();
}
function setLearningNext(){const n=document.getElementById("next");n.disabled=!(document.getElementById("topic")?.value&&state.intake.confidence)}
function readLearning(){state.intake.topic=document.getElementById("topic").value;state.intake.subtopic=document.getElementById("subtopic")?.value||"";state.intake.issue=document.getElementById("issue").value.trim();state.intake.testDate=document.getElementById("testDate").value;state.intake.materialName=selectedFile?.name||state.intake.materialName||""}
function buildQset(){const bank=topics[state.intake.topic]?.qs||topics["Forces, magnetism & electrostatics"].qs;state.qset=makeSlots(state.intake.confidence,bank);state.answers={};state.work={};state.locked={};state.feedback={}}
function renderReady(c,n){c.className="card hero";c.innerHTML='<div class="badge">Adaptive diagnostic ready</div><h2 style="color:#fff">Your questions are based on what you told us.</h2><p>If you said you are struggling, the check starts more gently. If you said you are okay, it uses more exam-style application questions. Once you submit an answer, it is locked.</p><div class="topicCard" style="background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.16);color:#fff"><b>'+esc(state.intake.topic)+'</b><span style="color:rgba(255,255,255,.72)">'+esc(state.intake.subtopic||"Whole topic")+' • 5 questions</span></div>';n.textContent="Start questions";n.disabled=false}
function renderQuestion(c,n,q,qi){
 const locked=!!state.locked[q.id],chosen=state.answers[q.id],fb=state.feedback[q.id];c.innerHTML='<div class="qnum"><span class="pill">Question '+(qi+1)+' of '+state.qset.length+'</span><span class="pill">'+esc(q.skill)+'</span></div><h2>'+esc(q.q)+'</h2>'+((q.id==="s1"||q.id==="c3")?circuitSvg():"")+
 '<div class="work"><label>Show your working / explain your thinking</label><textarea id="working" '+(locked?"disabled":"")+' placeholder="Write calculations, reasons or key steps here...">'+esc(state.work[q.id]||"")+'</textarea></div>'+
 (q.type==="mcq"?'<div class="choices">'+q.o.map((o,i)=>'<button type="button" class="choice '+(Number(chosen)===i?"selected":"")+'" '+(locked?"disabled":"")+' data-i="'+i+'">'+String.fromCharCode(65+i)+'. '+esc(o)+'</button>').join("")+'</div>':'<label>Your final answer '+(q.unit?"("+q.unit+")":"")+'</label><input id="numeric" type="text" inputmode="decimal" '+(locked?"disabled":"")+' value="'+esc(chosen??"")+'" placeholder="Enter your final numerical answer">')+
 (fb?'<div class="feedback '+(fb.correct?"good":"bad")+'"><b>'+(fb.correct?"Correct ✓":"Not correct — answer locked")+'</b>'+(fb.correct?"Your answer has been recorded.":'<div class="correctline">Correct answer: '+esc(fb.correctAnswer)+'</div><div class="memo"><strong>Memo:</strong> '+esc(q.m)+'</div>')+'</div>':"");
 if(q.type==="mcq"&&!locked)document.querySelectorAll(".choices .choice").forEach(btn=>btn.onclick=()=>{state.answers[q.id]=Number(btn.dataset.i);document.querySelectorAll(".choices .choice").forEach(x=>x.classList.toggle("selected",x===btn));save();n.disabled=false});
 if(!locked){document.getElementById("working").oninput=e=>{state.work[q.id]=e.target.value;save()};if(q.type==="num"){const el=document.getElementById("numeric");el.oninput=e=>{state.answers[q.id]=e.target.value.replace(",",".");save();n.disabled=!String(state.answers[q.id]||"").trim()}}}
 n.textContent=locked?(qi===state.qset.length-1?"Create tutor report":"Next question"):"Submit answer";n.disabled=locked?false:(state.answers[q.id]===undefined||String(state.answers[q.id]).trim()==="");
}
function gradeCurrent(){const qi=state.step-4,q=state.qset[qi];state.work[q.id]=document.getElementById("working")?.value||state.work[q.id]||"";if(q.type==="num")state.answers[q.id]=document.getElementById("numeric").value.replace(",",".");const a=state.answers[q.id],correct=q.type==="num"?Math.abs(Number(a)-Number(q.a))<=q.tol:Number(a)===q.a;state.locked[q.id]=true;state.feedback[q.id]={correct,correctAnswer:q.type==="num"?q.a+" "+q.unit:q.o[q.a]};save();render()}
function renderResults(c){
 const r=reportPayload();c.innerHTML='<div class="kicker">Tutor report ready</div><div class="score">'+r.pct+'%</div><h2>'+esc(r.name)+'’s learning snapshot</h2><p>This combines the lesson request, self-reported problem and diagnostic performance.</p>'+
 '<h3>Lesson request</h3><div class="metric"><small>First choice</small><b>'+esc(r.date1||"Not selected")+' • '+esc(r.time1||"—")+'</b></div><div class="metric"><small>Second choice</small><b>'+esc(r.date2||"Not selected")+' • '+esc(r.time2||"—")+'</b></div><div class="metric"><small>Format</small><b>'+esc(r.mode)+' • '+esc(r.duration)+'</b></div>'+
 '<h3>What the student needs</h3><div class="metric"><small>Topic</small><b>'+esc(r.topic)+'</b></div><div class="metric"><small>Specific area</small><b>'+esc(r.subtopic||"Whole topic / not sure")+'</b></div><div class="metric"><small>Student’s description</small>'+esc(r.issue||"No description entered")+'</div><div class="metric"><small>Confidence</small><b>'+esc(r.confidence)+'</b></div>'+
 '<h3>Diagnostic</h3><div class="metric"><small>Score</small><b>'+r.score+'/'+r.total+' ('+r.pct+'%)</b></div><div class="metric"><small>Weakest skill pattern</small><b>'+esc(r.weakestSkill)+'</b></div>'+
 r.reviews.map((x,i)=>'<div class="qreview '+(x.correct?"ok":"no")+'"><b>'+(i+1)+'. '+(x.correct?"Correct":"Needs work")+'</b><small>'+esc(x.q)+'</small>'+(x.working?'<small><strong>Working:</strong> '+esc(x.working)+'</small>':"")+(x.correct?"":'<small><strong>Correct:</strong> '+esc(x.correctAnswer)+'</small>')+'</div>').join("")+
 '<div class="share"><button class="primary" onclick="shareTutorReport()">Send report to Victoria</button><button class="secondary" onclick="copyTutorLink()">Copy tutor report link</button><button class="secondary" onclick="restartCheck()">Start a new check-in</button></div><div class="hint">No credits or account are needed. The report link contains this completed check-in, so only send it to the tutor/parent you intend to share it with.</div>';
}
async function shareTutorReport(){
 const r=reportPayload(),url=location.origin+location.pathname+"#report="+b64obj(r),text=reportText(r);let data={title:"Student check-in — "+r.name,text,url};if(selectedFile&&navigator.canShare){try{if(navigator.canShare({files:[selectedFile]}))data.files=[selectedFile]}catch(e){}}
 try{if(navigator.share)await navigator.share(data);else{await navigator.clipboard.writeText(text+"\n\nTutor report: "+url);showToast("Report copied — paste it into WhatsApp.")}}catch(e){if(e.name!=="AbortError"){await navigator.clipboard.writeText(text+"\n\nTutor report: "+url);showToast("Report copied — paste it into WhatsApp.")}}
}
async function copyTutorLink(){const r=reportPayload(),url=location.origin+location.pathname+"#report="+b64obj(r);await navigator.clipboard.writeText(url);showToast("Tutor report link copied.")}
function restartCheck(){if(confirm("Clear this check-in and start again?")){localStorage.removeItem("vtaStudentCheckV3");location.hash="";location.reload()}}
function renderReportView(r){
 document.body.classList.add("reportMode");document.getElementById("root").innerHTML='<div class="app"><main class="shell"><section class="card"><div class="badge">Tutor report • Read-only</div><h1>'+esc(r.name)+' — Student Check-In</h1><p>Submitted '+new Date(r.submitted).toLocaleString()+'</p><h3>Scheduling</h3><div class="metric"><small>1st choice</small><b>'+esc(r.date1||"—")+' • '+esc(r.time1||"—")+'</b></div><div class="metric"><small>2nd choice</small><b>'+esc(r.date2||"—")+' • '+esc(r.time2||"—")+'</b></div><div class="metric"><small>Format</small><b>'+esc(r.mode)+' • '+esc(r.duration)+'</b></div><h3>Lesson focus</h3><div class="metric"><small>Topic</small><b>'+esc(r.topic)+'</b></div><div class="metric"><small>Specific area</small><b>'+esc(r.subtopic||"—")+'</b></div><div class="metric"><small>Student says</small>'+esc(r.issue||"—")+'</div><div class="metric"><small>Confidence</small><b>'+esc(r.confidence)+'</b></div><div class="metric"><small>Upcoming test</small><b>'+esc(r.testDate||"Not given")+'</b></div><div class="metric"><small>Material selected</small><b>'+esc(r.materialName||"None")+'</b></div><h3>Diagnostic result</h3><div class="score">'+r.pct+'%</div><div class="metric"><small>Score</small><b>'+r.score+'/'+r.total+'</b></div><div class="metric"><small>Weakest skill</small><b>'+esc(r.weakestSkill)+'</b></div><h3>Question-by-question</h3>'+r.reviews.map((x,i)=>'<div class="qreview '+(x.correct?"ok":"no")+'"><b>'+(i+1)+'. '+(x.correct?"Correct":"Needs work")+'</b><small>'+esc(x.q)+'</small><small><strong>Student answer:</strong> '+esc(x.answer)+'</small><small><strong>Working:</strong> '+esc(x.working||"No working entered")+'</small>'+(x.correct?"":'<small><strong>Correct answer:</strong> '+esc(x.correctAnswer)+'</small><small><strong>Memo:</strong> '+esc(x.memo)+'</small>')+'</div>').join("")+'<div class="share"><button class="primary" id="copyText">Copy full report</button></div></section></main></div>';document.getElementById("copyText").onclick=async()=>{await navigator.clipboard.writeText(reportText(r));showToast("Full report copied.")}}
function boot(){
 if(sessionStorage.getItem("vta_check_access")!=="1"){renderGate();return}
 const m=location.hash.match(/^#report=(.+)$/);if(m){try{renderReportView(unb64(m[1]));return}catch(e){}}
 rootShell();render();
}
boot();
</script>
</body>
</html>
