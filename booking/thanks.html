<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0F172A">
<title>Request sent | Victoria Tuition Academy</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;background:linear-gradient(160deg,#0F172A,#172033);font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;color:#0F172A}
.card{max-width:560px;width:100%;background:#fff;border-radius:28px;padding:34px;box-shadow:0 28px 80px rgba(0,0,0,.28);text-align:center}
.mark{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;margin:0 auto 18px;background:#DCFCE7;color:#15803D;font-size:30px;font-weight:900}
h1{font-size:32px;letter-spacing:-.04em;margin:0 0 10px}p{color:#64748B;line-height:1.6;margin:0 0 20px}.note{background:#FFF7ED;border:1px solid #FED7AA;border-radius:16px;padding:14px;color:#9A3412;font-size:13px;line-height:1.5;margin:20px 0}.btn{display:block;text-decoration:none;background:#E54D2E;color:#fff;font-weight:850;padding:14px 18px;border-radius:14px;margin-top:12px}.sub{display:block;text-decoration:none;color:#0F172A;background:#EEF2F7;font-weight:800;padding:14px 18px;border-radius:14px;margin-top:10px}.brand{font-size:12px;color:#94A3B8;margin-top:20px}
</style>
</head><body>
<div class="card">
<div class="mark">✓</div>
<h1>Request sent.</h1>
<p>Your lesson request has been sent to Victoria Tuition Academy.</p>
<div class="note"><strong>Your lesson is not confirmed yet.</strong><br>Victoria will check the requested time and contact you to confirm the booking.</div>
<a class="btn" href="./">Book another lesson</a>
<a class="sub" href="javascript:history.back()">Back to my request</a>
<div class="brand">Victoria Tuition Academy · Better Understanding. Better Results.</div>
</div>
</body></html>
