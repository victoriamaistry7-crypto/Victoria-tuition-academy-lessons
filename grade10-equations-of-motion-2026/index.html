<style>
:root{--navy:#0f172a;--ink:#1e293b;--muted:#64748b;--line:#e2e8f0;--orange:#e54d2e;--green:#16a34a;--blue:#2563eb;--soft:#f8fafc}
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;background:linear-gradient(135deg,#f8fafc,#eef2ff);color:var(--ink)}
header{position:sticky;top:0;z-index:10;background:#ffffffed;border-bottom:1px solid var(--line);backdrop-filter:blur(9px)}
.head{max-width:1100px;margin:auto;padding:12px 16px;display:flex;gap:12px;align-items:center}.brand{font-weight:900;color:var(--navy);white-space:nowrap}.track{height:8px;background:#e5e7eb;border-radius:99px;overflow:hidden;flex:1}.prog{height:100%;background:var(--orange);width:0}.count{font-size:13px;color:var(--muted);font-weight:800}
main{max-width:1100px;margin:auto;padding:22px 16px 105px}.slide{display:none;background:#fff;border:1px solid var(--line);border-radius:24px;padding:clamp(20px,4vw,42px);min-height:610px;box-shadow:0 18px 50px #0f172a12}.slide.active{display:block}
.eyebrow{font-size:12px;font-weight:900;letter-spacing:.13em;text-transform:uppercase;color:var(--orange)}h1,h2,h3{color:var(--navy);margin-top:0}h1{font-size:clamp(38px,6vw,62px);line-height:1.02}h2{font-size:clamp(28px,4vw,42px)}h3{font-size:20px}.lead{font-size:clamp(17px,2vw,21px);line-height:1.55;color:#334155;max-width:850px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:24px;align-items:center}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.card{background:var(--soft);border:1px solid var(--line);border-radius:17px;padding:17px}.math{font-family:"Cambria Math","Times New Roman",serif}.formula{font-family:"Cambria Math","Times New Roman",serif;font-size:clamp(24px,3.2vw,38px);font-weight:800;color:var(--navy);background:#fff7ed;border-left:5px solid var(--orange);padding:14px 17px;border-radius:12px}.call{margin-top:16px;padding:15px 17px;border-radius:15px;background:#eff6ff;border:1px solid #bfdbfe;color:#1e3a8a}.warn{margin-top:16px;padding:15px 17px;border-radius:15px;background:#fef3c7;border:1px solid #fde68a;color:#92400e}
.steps{display:grid;gap:10px}.step{display:flex;gap:11px}.step b{display:grid;place-items:center;flex:0 0 30px;height:30px;border-radius:50%;background:var(--navy);color:white}
.visual{background:#fff;border:1px solid var(--line);border-radius:17px;padding:12px}svg{width:100%;height:auto;display:block}
.q{margin-top:20px;border:2px solid var(--line);border-radius:17px;padding:17px}.qtop{display:flex;justify-content:space-between;gap:10px}.marks{background:var(--navy);color:#fff;border-radius:99px;padding:6px 9px;font-size:12px;font-weight:900;white-space:nowrap}.opts{display:grid;gap:9px;margin-top:12px}.opt{width:100%;text-align:left;min-height:48px;border:1px solid #cbd5e1;background:#fff;border-radius:13px;padding:12px 14px;font-weight:750;color:#334155}.opt.correct{background:#f0fdf4;border-color:#86efac;color:#166534}.opt.wrong{background:#fef2f2;border-color:#fecaca;color:#991b1b}.fb{display:none;margin-top:11px;padding:12px 14px;border-radius:13px}.fb.good{display:block;background:#f0fdf4;border:1px solid #bbf7d0;color:#166534}.fb.bad{display:block;background:#fef2f2;border:1px solid #fecaca;color:#991b1b}
nav{position:fixed;left:0;right:0;bottom:0;background:#ffffffef;border-top:1px solid var(--line);backdrop-filter:blur(9px)}.navin{max-width:1100px;margin:auto;padding:12px 16px;display:flex;justify-content:space-between}.btn{min-height:46px;border-radius:12px;padding:11px 16px;font-weight:850;border:0}.primary{background:var(--orange);color:#fff}.secondary{background:#fff;color:var(--navy);border:1px solid #cbd5e1}.pill{display:inline-block;background:#eef2ff;color:#4338ca;border-radius:99px;padding:5px 9px;font-size:12px;font-weight:850}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:15px}table{width:100%;border-collapse:collapse;min-width:620px}th,td{padding:11px 13px;border-bottom:1px solid var(--line);text-align:left}th{background:#f8fafc;color:var(--navy)}
.kpis{display:flex;gap:12px;flex-wrap:wrap}.kpi{flex:1;min-width:150px;background:var(--soft);border:1px solid var(--line);border-radius:15px;padding:15px}.kv{font-size:32px;font-weight:900;color:var(--orange)}.reportgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.ritem{border:1px solid var(--line);border-radius:15px;padding:14px}.bar{height:8px;background:#e2e8f0;border-radius:99px;overflow:hidden;margin-top:7px}.bar span{display:block;height:100%;background:var(--orange)}
@media(max-width:800px){.grid2,.grid3,.reportgrid{grid-template-columns:1fr}.slide{min-height:auto;padding:21px 15px}.brand{font-size:14px}h1{font-size:40px}h2{font-size:30px}.qtop{flex-direction:column}}

<header><div class="head"><div class="brand">Victoria Tuition Academy</div><div class="track"><div id="prog" class="prog"></div></div><div id="count" class="count"></div></div></header>

<script>
const slides=[
{e:"Grade 10 Physical Sciences • Mechanics",t:"Equations of Motion",body:`<div class="grid2"><div><p class="lead">A one-hour mastery lesson on choosing equations, sign conventions, graphs, braking and exam-style constant-acceleration problems.</p><p><span class="pill">1 hour</span> <span class="pill">CAPS</span> <span class="pill">Exam practice</span></p><button class="btn primary" id="start">Start lesson</button></div><div class="visual"><svg viewBox="0 0 560 330"><line x1="50" y1="260" x2="510" y2="260" stroke="#64748b" stroke-width="5"/><rect x="145" y="180" width="190" height="58" rx="17" fill="#eff6ff" stroke="#2563eb" stroke-width="4"/><path d="M188 180 L225 143 H286 L320 180" fill="#dbeafe" stroke="#2563eb" stroke-width="4"/><circle cx="195" cy="245" r="23" fill="#0f172a"/><circle cx="305" cy="245" r="23" fill="#0f172a"/><line x1="345" y1="205" x2="475" y2="205" stroke="#e54d2e" stroke-width="6"/><polygon points="475,205 455,194 455,216" fill="#e54d2e"/><text x="410" y="180" text-anchor="middle" font-size="20" font-weight="900" fill="#e54d2e">a &gt; 0</text></svg></div></div>`},
{e:"Lesson map",t:"What you must be able to do",body:`<div class="grid3"><div class="card"><h3>Understand</h3><p>Know vᵢ, v𝒇, a, Δt and Δx and when the equations apply.</p></div><div class="card"><h3>Apply</h3><p>Choose the correct equation from known and unknown quantities.</p></div><div class="card"><h3>Master</h3><p>Use graphs, signs and stopping-distance reasoning in exam questions.</p></div></div><div class="call"><strong>Rule:</strong> the equations below are used when acceleration is constant.</div>`},
{e:"Foundation",t:"Know the five motion quantities",body:`<div class="tablewrap"><table><tr><th>Symbol</th><th>Meaning</th><th>Unit</th><th>Question clue</th></tr><tr><td class="math">vᵢ</td><td>initial velocity</td><td>m·s⁻¹</td><td>starts at…</td></tr><tr><td class="math">v𝒇</td><td>final velocity</td><td>m·s⁻¹</td><td>reaches… / stops</td></tr><tr><td class="math">a</td><td>acceleration</td><td>m·s⁻²</td><td>accelerates/decelerates at…</td></tr><tr><td class="math">Δt</td><td>time interval</td><td>s</td><td>for 5 s</td></tr><tr><td class="math">Δx</td><td>displacement</td><td>m</td><td>displacement/how far from start</td></tr></table></div><div class="warn"><strong>Starts from rest:</strong> vᵢ = 0. <strong>Comes to rest:</strong> v𝒇 = 0.</div>`},
{e:"Sign convention",t:"Direction controls the signs",body:`<div class="grid2"><div><div class="steps"><div class="step"><b>1</b><div>Choose a positive direction.</div></div><div class="step"><b>2</b><div>Quantities pointing that way are positive.</div></div><div class="step"><b>3</b><div>Opposite-direction vectors are negative.</div></div></div><div class="call"><strong>Important:</strong> deceleration is not automatically negative. The sign depends on direction.</div></div><div class="visual"><svg viewBox="0 0 540 240"><line x1="80" y1="120" x2="460" y2="120" stroke="#0f172a" stroke-width="4"/><polygon points="460,120 440,108 440,132" fill="#0f172a"/><polygon points="80,120 100,108 100,132" fill="#0f172a"/><text x="385" y="88" font-size="22" font-weight="900" fill="#16a34a">EAST +</text><text x="80" y="88" font-size="22" font-weight="900" fill="#e54d2e">− WEST</text></svg></div></div>`,q:{topic:"Signs & Concepts",marks:2,answer:1,text:"East is positive. A car moves west at 12 m·s⁻¹. Its velocity is:",opts:["+12 m·s⁻¹","−12 m·s⁻¹","0 m·s⁻¹","12 m·s⁻²"],fb:"West is opposite the chosen positive direction, so velocity is −12 m·s⁻¹."}},
{e:"Formula toolbox",t:"The four equations of motion",body:`<div class="grid2"><div class="card"><div class="formula">v𝒇 = vᵢ + aΔt</div><p>No displacement needed.</p></div><div class="card"><div class="formula">Δx = vᵢΔt + ½a(Δt)²</div><p>No final velocity needed.</p></div><div class="card"><div class="formula">v𝒇² = vᵢ² + 2aΔx</div><p>No time needed.</p></div><div class="card"><div class="formula">Δx = ½(vᵢ + v𝒇)Δt</div><p>Uses average velocity.</p></div></div><div class="warn"><strong>Method:</strong> list known values first, circle the unknown, then choose the equation that contains those quantities.</div>`},
{e:"Equation 1",t:"Find final velocity",body:`<div class="formula">v𝒇 = vᵢ + aΔt</div><div class="card" style="margin-top:16px"><h3>Worked example</h3><p>A car travels at 8 m·s⁻¹ and accelerates at 3 m·s⁻² for 4 s.</p><p class="math">v𝒇 = 8 + 3(4) = <strong>20 m·s⁻¹</strong></p></div>`,q:{topic:"Equation Selection",marks:3,answer:2,text:"A cyclist starts at 5 m·s⁻¹ and accelerates at 2 m·s⁻² for 6 s. Find v𝒇.",opts:["7 m·s⁻¹","12 m·s⁻¹","17 m·s⁻¹","30 m·s⁻¹"],fb:"v𝒇 = 5 + 2(6) = 17 m·s⁻¹."}},
{e:"Equation 2",t:"Find displacement after a time",body:`<div class="formula">Δx = vᵢΔt + ½a(Δt)²</div><div class="card" style="margin-top:16px"><h3>Worked example</h3><p>A trolley starts from rest and accelerates at 2 m·s⁻² for 5 s.</p><p class="math">Δx = 0(5) + ½(2)(5²) = <strong>25 m</strong></p></div><div class="warn">Square the entire time value: if Δt = 5 s, then (Δt)² = 25 s².</div>`,q:{topic:"Displacement",marks:3,answer:1,text:"A car starts from rest and accelerates at 4 m·s⁻² for 3 s. Find Δx.",opts:["6 m","18 m","36 m","12 m"],fb:"Δx = ½(4)(3²) = 18 m."}},
{e:"Equation 3",t:"No time? Use the squared-velocity equation",body:`<div class="formula">v𝒇² = vᵢ² + 2aΔx</div><div class="card" style="margin-top:16px"><h3>Worked example</h3><p>A car speeds up from 10 to 18 m·s⁻¹ over 56 m.</p><p class="math">18² = 10² + 2a(56)</p><p class="math">324 = 100 + 112a → <strong>a = 2 m·s⁻²</strong></p></div>`,q:{topic:"Equation Selection",marks:3,answer:0,text:"You know vᵢ, v𝒇 and a, and need Δx. Time is unknown. Best equation?",opts:["v𝒇² = vᵢ² + 2aΔx","v𝒇 = vᵢ + aΔt","Δx = vᵢΔt + ½aΔt²","a = Δx/Δt"],fb:"The squared-velocity equation uses vᵢ, v𝒇, a and Δx but no time."}},
{e:"Equation 4",t:"Use average velocity",body:`<div class="formula">Δx = ½(vᵢ + v𝒇)Δt</div><div class="card" style="margin-top:16px"><p>vᵢ = 4 m·s⁻¹, v𝒇 = 16 m·s⁻¹, Δt = 6 s</p><p class="math">Δx = ½(4+16)(6) = 10×6 = <strong>60 m</strong></p></div>`,q:{topic:"Average Velocity",marks:3,answer:1,text:"A train increases velocity from 10 to 22 m·s⁻¹ in 8 s. Find Δx.",opts:["96 m","128 m","176 m","256 m"],fb:"Average velocity = (10+22)/2 = 16 m·s⁻¹. Δx = 16×8 = 128 m."}},
{e:"Graphs",t:"Velocity–time graphs tell the same story",body:`<div class="grid2"><div class="visual"><svg viewBox="0 0 530 360"><line x1="75" y1="300" x2="465" y2="300" stroke="#0f172a" stroke-width="3"/><line x1="75" y1="300" x2="75" y2="55" stroke="#0f172a" stroke-width="3"/><polygon points="75,300 75,245 390,90 390,300" fill="#dbeafe" opacity=".6"/><line x1="75" y1="245" x2="390" y2="90" stroke="#2563eb" stroke-width="5"/><text x="220" y="130" font-size="17" font-weight="900" fill="#2563eb">gradient = acceleration</text><text x="210" y="275" font-size="17" font-weight="900" fill="#1e3a8a">area = displacement</text></svg></div><div><div class="formula">a = Δv / Δt</div><div class="call"><strong>Area under a v–t graph</strong> gives displacement.</div></div></div>`,q:{topic:"Graphs",marks:2,answer:2,text:"The gradient of a velocity–time graph represents:",opts:["displacement","velocity","acceleration","distance"],fb:"Gradient = change in velocity ÷ change in time = acceleration."}},
{e:"Choosing an equation",t:"A reliable exam method",body:`<div class="steps"><div class="step"><b>1</b><div>Write vᵢ, v𝒇, a, Δt, Δx.</div></div><div class="step"><b>2</b><div>Fill in all known values with signs.</div></div><div class="step"><b>3</b><div>Circle the unknown.</div></div><div class="step"><b>4</b><div>Choose an equation containing the unknown and known values.</div></div><div class="step"><b>5</b><div>Substitute, solve and include the SI unit.</div></div></div>`,q:{topic:"Equation Selection",marks:2,answer:1,text:"You know vᵢ, a, Δt and need Δx, but do not know v𝒇. Most direct equation?",opts:["v𝒇 = vᵢ + aΔt","Δx = vᵢΔt + ½a(Δt)²","v𝒇² = vᵢ² + 2aΔx","F = ma"],fb:"This equation finds Δx directly using vᵢ, a and time."}},
{e:"Worked exam problem",t:"Braking with signs",body:`<p class="lead">A car moves east at 20 m·s⁻¹ and brakes uniformly at 4 m·s⁻² until it stops. East is positive.</p><div class="grid2"><div class="card"><h3>Known values</h3><p class="math">vᵢ = +20 m·s⁻¹</p><p class="math">v𝒇 = 0</p><p class="math">a = −4 m·s⁻²</p></div><div class="card"><h3>Stopping time</h3><p class="math">0 = 20 − 4Δt</p><p class="math"><strong>Δt = 5 s</strong></p></div></div><div class="call">Acceleration is negative because it points opposite the chosen positive direction.</div>`},
{e:"Stopping distance",t:"Why speed matters so much",body:`<div class="grid2"><div><div class="formula">0 = vᵢ² + 2aΔx</div><p class="lead">For the same braking acceleration, braking distance depends on the square of initial speed.</p><div class="call">Double the speed → about <strong>four times</strong> the braking distance.</div></div><div class="visual"><svg viewBox="0 0 520 260"><line x1="60" y1="80" x2="460" y2="80" stroke="#cbd5e1" stroke-width="4"/><line x1="100" y1="80" x2="250" y2="80" stroke="#16a34a" stroke-width="10"/><text x="175" y="58" text-anchor="middle" font-weight="900">lower speed</text><line x1="60" y1="190" x2="460" y2="190" stroke="#cbd5e1" stroke-width="4"/><line x1="100" y1="190" x2="445" y2="190" stroke="#e54d2e" stroke-width="10"/><text x="270" y="168" text-anchor="middle" font-weight="900">higher speed → longer stop</text></svg></div></div>`,q:{topic:"Stopping Distance",marks:2,answer:2,text:"If braking acceleration stays the same and speed doubles, braking distance becomes approximately:",opts:["half","double","four times","unchanged"],fb:"Because velocity is squared, 2² = 4."}},
{e:"Common mistakes",t:"Protect these marks",body:`<div class="grid3"><div class="card"><h3>No sign convention</h3><p>Direction errors lead to wrong acceleration or displacement signs.</p></div><div class="card"><h3>Wrong units</h3><p>Use s, m, m·s⁻¹ and m·s⁻².</p></div><div class="card"><h3>Wrong equation</h3><p>Choose from knowns and unknowns, not memory alone.</p></div><div class="card"><h3>Forgetting rest</h3><p>Start from rest → vᵢ=0. Stop → v𝒇=0.</p></div><div class="card"><h3>Missing squares</h3><p>Both velocity terms are squared in equation 3.</p></div><div class="card"><h3>No unit</h3><p>Finish every numerical answer with an SI unit.</p></div></div>`},
{e:"Final challenge",t:"Mixed exam-style mastery check",body:`<p class="lead">Complete all four. These combine the skills from the lesson.</p>`,
 qs:[
 {topic:"Final Mixed",marks:3,answer:3,text:"1. vᵢ=4 m·s⁻¹, a=3 m·s⁻², t=5 s. Find v𝒇.",opts:["11","15","17","19 m·s⁻¹"],fb:"v𝒇=4+3(5)=19 m·s⁻¹."},
 {topic:"Final Mixed",marks:3,answer:1,text:"2. Starts from rest, a=2 m·s⁻², t=6 s. Find Δx.",opts:["12 m","36 m","72 m","6 m"],fb:"Δx=½(2)(6²)=36 m."},
 {topic:"Final Mixed",marks:4,answer:0,text:"3. A car at 16 m·s⁻¹ brakes at −4 m·s⁻² to rest. Stopping distance?",opts:["32 m","64 m","8 m","4 m"],fb:"0=16²+2(−4)Δx → Δx=32 m."},
 {topic:"Final Mixed",marks:3,answer:2,text:"4. Velocity changes from 6 to 18 m·s⁻¹ in 4 s. Acceleration?",opts:["2","2.5","3 m·s⁻²","6"],fb:"a=(18−6)/4=3 m·s⁻²."}
 ]},
{e:"Reflection",t:"Before the report",body:`<div class="grid3"><div class="card"><h3>Can you identify?</h3><p>Knowns, unknowns and hidden clues such as “comes to rest”.</p></div><div class="card"><h3>Can you choose?</h3><p>The equation that fits the information instead of guessing.</p></div><div class="card"><h3>Can you calculate?</h3><p>With a consistent sign convention and correct SI units.</p></div></div><div class="call"><strong>Next:</strong> generate the diagnostic report.</div><button id="makeReport" class="btn primary" style="margin-top:16px">Generate report</button>`},
{e:"Student report",t:"Equations of Motion — Diagnostic Report",report:true}
];

const deck=document.getElementById("deck"),answers={},topicMax={};let qn=0;
function qHTML(q){qn++;topicMax[q.topic]=(topicMax[q.topic]||0)+q.marks;return `<div class="q" data-q="${qn}" data-topic="${q.topic}" data-marks="${q.marks}" data-answer="${q.answer}"><div class="qtop"><h3>${q.text}</h3><span class="marks">${q.marks} marks</span></div><div class="opts">${q.opts.map((o,i)=>`<button class="opt" data-c="${i}">${String.fromCharCode(65+i)}. ${o}</button>`).join("")}</div><div class="fb">${q.fb}</div></div>`}
slides.forEach((s,i)=>{let body=s.body||"";if(s.q)body+=qHTML(s.q);if(s.qs)body+=s.qs.map(qHTML).join("");if(s.report)body=`<p id="msg" class="lead"></p><div class="kpis"><div class="kpi"><small>Score</small><div id="score" class="kv"></div></div><div class="kpi"><small>Percentage</small><div id="pct" class="kv"></div></div><div class="kpi"><small>Completed</small><div id="done" class="kv"></div></div></div><h3 style="margin-top:24px">Topic breakdown</h3><div id="topics" class="reportgrid"></div><div class="grid2" style="margin-top:18px"><div class="card"><h3>Strengths</h3><p id="strong"></p></div><div class="card"><h3>Priority revision</h3><p id="weak"></p></div></div><div id="nextStep" class="call"></div><div style="margin-top:18px"><button id="print" class="btn secondary">Print / Save PDF</button> <button id="restart" class="btn secondary">Restart</button></div>`;deck.insertAdjacentHTML("beforeend",`<section class="slide${i===0?" active":""}" ${s.report?'id="report"':""}><div class="eyebrow">${s.e}</div><h1 style="font-size:clamp(32px,5vw,52px)">${s.t}</h1>${body}</section>`)})

document.querySelectorAll(".q").forEach(box=>{const id=box.dataset.q,correct=+box.dataset.answer,marks=+box.dataset.marks,topic=box.dataset.topic,fb=box.querySelector(".fb"),opts=[...box.querySelectorAll(".opt")];opts.forEach(btn=>btn.addEventListener("click",()=>{if(answers[id])return;const c=+btn.dataset.c,ok=c===correct;answers[id]={topic,marks:ok?marks:0,max:marks};opts.forEach((b,j)=>{b.disabled=true;if(j===correct)b.classList.add("correct")});if(!ok)btn.classList.add("wrong");fb.classList.add(ok?"good":"bad");fb.innerHTML=`<strong>${ok?`Correct — ${marks}/${marks} marks.`:`Not quite — 0/${marks} marks.`}</strong><br>${fb.textContent}`}))})

const all=[...document.querySelectorAll(".slide")];let cur=0;const maxMarks=Object.values(topicMax).reduce((a,b)=>a+b,0);
function show(i){cur=Math.max(0,Math.min(all.length-1,i));all.forEach((s,j)=>s.classList.toggle("active",j===cur));document.getElementById("count").textContent=`${cur+1} / ${all.length}`;document.getElementById("prog").style.width=`${(cur+1)/all.length*100}%`;document.getElementById("prev").disabled=cur===0;document.getElementById("next").textContent=cur===all.length-1?"Finish":"Next →";scrollTo({top:0,behavior:"smooth"})}
