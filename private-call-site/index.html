<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#09070d">
  <title>V Private Call</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <main class="shell">
    <section class="phone">
      <header class="top">
        <div class="avatar">V</div>
        <div>
          <h1>Private Call</h1>
          <p>AI companion · voice conversation</p>
        </div>
        <span class="badge">PRIVATE</span>
      </header>
      <section class="call">
        <div id="orb" class="orb"><span>♡</span><i></i><i></i></div>
        <h2 id="title">Ready to talk</h2>
        <p id="status">Tap Start Call, allow your microphone, and speak naturally.</p>
        <div id="timer" class="timer">00:00</div>
        <div class="controls">
          <button id="mute" class="round" disabled>🎙</button>
          <button id="start" class="start">Start call</button>
          <button id="end" class="round end" disabled>✕</button>
        </div>
      </section>
      <section class="voice-panel">
        <div>
          <strong>Voice</strong>
          <span>Choose the closest voice available on this device</span>
        </div>
        <select id="voiceSelect"></select>
        <div class="sliders">
          <label>Warmth / pitch <input id="pitch" type="range" min="0.7" max="1.1" step="0.05" value="0.9"></label>
          <label>Speaking pace <input id="rate" type="range" min="0.75" max="1.1" step="0.05" value="0.9"></label>
        </div>
        <button id="preview" class="preview">Preview voice</button>
      </section>
      <footer>This uses a synthetic device voice. It does not clone or impersonate the real person.</footer>
    </section>
  </main>
  <script src="./app.js"></script>
</body>
</html>
