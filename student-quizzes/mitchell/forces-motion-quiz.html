<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mitchell | Forces & Motion Quiz</title><style>
:root{--p:#121b31;--t:#f7f8fc;--m:#b9c2da;--l:#304067;--a:#8b5cf6;--g:#22c55e;--r:#ef4444}*{box-sizing:border-box}body{margin:0;background:linear-gradient(#070c18,#0b1122);color:var(--t);font:16px/1.5 system-ui,-apple-system,Segoe UI,Arial}main{max-width:850px;margin:auto;padding:16px}.hero,.card,.result{background:var(--p);border:1px solid var(--l);border-radius:19px;padding:17px;margin-bottom:14px}.k{color:#c4b5fd;font-size:12px;text-transform:uppercase;font-weight:800;letter-spacing:.08em}h1{font-size:clamp(30px,7vw,44px);line-height:1.05;margin:6px 0}.muted{color:var(--m)}.num{font-size:12px;color:#c4b5fd;font-weight:800}.stem{font-weight:800;font-size:17px;margin:5px 0 10px}.opt{display:flex;gap:10px;padding:12px;border:1px solid #3b486f;border-radius:12px;margin:8px 0;background:#111a30}.opt input{margin-top:4px}.opt label{width:100%}.ex{display:none;margin-top:10px;padding:11px;border-radius:11px;background:#0b1428;border-left:4px solid var(--a)}.locked .ex{display:block}.locked .correct{border-color:var(--g);background:#10261c}.locked .wrong.selected{border-color:var(--r);background:#2a141b}button{width:100%;padding:14px;border:0;border-radius:13px;background:var(--a);color:white;font-weight:800;font-size:16px}.score{font-size:34px;font-weight:900}.progress{height:9px;background:#080d1a;border-radius:99px;overflow:hidden;border:1px solid #273452}.fill{height:100%;width:0;background:linear-gradient(90deg,var(--a),var(--g))}
</style></head><body><main><section class="hero"><div class="k">Victoria Tuition Academy • Mitchell</div><h1>Forces & Motion Quiz</h1><p class="muted">15 questions. Answers and explanations only appear after submission.</p><div class="progress"><div class="fill" id="fill"></div></div></section><form id="quiz"></form><section class="result" id="result" hidden></section></main>
<script>const qs=[["Which statement correctly describes a vector quantity?",["It has magnitude only.","It has direction only.","It has magnitude and direction.","It has neither magnitude nor direction."],2,"A vector has both magnitude and direction."],["A box has 18 N right and 7 N left. What is the resultant force?",["25 N right","11 N right","11 N left","25 N left"],1,"18 − 7 = 11 N right."],["Two forces of 12 N and 9 N both act left. What is the resultant?",["3 N left","21 N left","21 N right","3 N right"],1,"Same direction: 12 + 9 = 21 N left."],["What does a resultant force of 0 N mean?",["No forces are acting.","The forces are balanced.","The object must be stationary.","The object must speed up."],1,"A 0 N resultant means the forces are balanced."],["Which is a non-contact force?",["Friction","Tension","Normal force","Gravitational force"],3,"Gravity acts without physical contact."],["An object moves at constant velocity. Which statement is best?",["It must have a forward resultant force.","Its resultant force is 0 N.","Speed is acting as a force.","No forces act on it."],1,"Constant velocity means no acceleration, so the resultant force is 0 N."],["A trolley has 25 N east, 10 N west and 5 N west. Resultant?",["10 N east","20 N east","40 N east","10 N west"],0,"West total = 15 N; 25 − 15 = 10 N east."],["Which force usually opposes sliding motion?",["Magnetic force","Friction","Gravity","Normal force"],1,"Friction opposes relative motion between contacting surfaces."],["Which statement about balanced forces is correct?",["They always stop objects.","They have a resultant of 0 N.","They point in the same direction.","They cause acceleration."],1,"Balanced forces produce a net force of 0 N."],["A force arrow points left and is labelled 15 N. What does it show?",["Magnitude only","Direction only","Magnitude and direction","Mass and direction"],2,"The label gives magnitude and the arrow gives direction."],["A crate has 40 N right and 40 N left. Which conclusion is justified?",["It must be at rest.","It must move right.","The forces are balanced.","The resultant is 80 N."],2,"Equal opposite forces give 0 N resultant."],["Which is a contact force?",["Magnetic","Electrostatic","Gravitational","Tension"],3,"Tension is transmitted by a contacting rope, string, or cable."],["A cart has a resultant force of 6 N left. What must be true?",["The forces are balanced.","It has no acceleration.","The forces are unbalanced.","No other force acts."],2,"Any non-zero resultant means the forces are unbalanced."],["A box has 22 N right and 8 N friction left. Which answer is complete?",["14 N right, unbalanced","30 N right, balanced","14 N left, unbalanced","30 N left, balanced"],0,"22 − 8 = 14 N right; non-zero means unbalanced."],["17 N right and 9 N left. Which exam answer is most complete?",["8 N","26 N right","8 N right; forces unbalanced","8 N left; forces balanced"],2,"17 − 9 = 8 N right; a non-zero resultant is unbalanced."]],form=document.getElementById('quiz'),fill=document.getElementById('fill'),result=document.getElementById('result');qs.forEach((x,i)=>{const c=document.createElement('section');c.className='card';c.dataset.i=i;c.innerHTML='<div class="num">QUESTION '+(i+1)+' OF '+qs.length+'</div><div class="stem">'+x[0]+'</div>';x[1].forEach((o,j)=>{const id='q'+i+'_'+j,d=document.createElement('div');d.className='opt';d.innerHTML='<input type="radio" name="q'+i+'" id="'+id+'" value="'+j+'"><label for="'+id+'">'+String.fromCharCode(65+j)+'. '+o+'</label>';c.appendChild(d)});const e=document.createElement('div');e.className='ex';e.textContent=x[3];c.appendChild(e);form.appendChild(c)});const b=document.createElement('button');b.type='submit';b.textContent='Submit quiz';form.appendChild(b);form.addEventListener('change',()=>{let n=0;qs.forEach((_,i)=>{if(form.querySelector('input[name="q'+i+'"]:checked'))n++});fill.style.width=Math.round(n/qs.length*100)+'%'});form.addEventListener('submit',e=>{e.preventDefault();const m=[];qs.forEach((_,i)=>{if(!form.querySelector('input[name="q'+i+'"]:checked'))m.push(i+1)});if(m.length){result.hidden=false;result.innerHTML='<b>Please answer every question.</b><p>Missing: '+m.join(', ')+'</p>';result.scrollIntoView({behavior:'smooth'});return}let s=0;qs.forEach((x,i)=>{const c=form.querySelector('[data-i="'+i+'"]'),sel=+form.querySelector('input[name="q'+i+'"]:checked').value;if(sel===x[2])s++;c.querySelectorAll('.opt').forEach((o,j)=>{if(j===x[2])o.classList.add('correct');if(j===sel)o.classList.add('selected');if(j!==x[2])o.classList.add('wrong')});c.classList.add('locked');c.querySelectorAll('input').forEach(y=>y.disabled=true)});b.disabled=true;const p=Math.round(s/qs.length*100);result.hidden=false;result.innerHTML='<div class="score">'+s+'/'+qs.length+' ('+p+'%)</div><p>'+(p>=80?'Strong understanding.':p>=60?'Good foundation — review the explanations below.':'Review the lesson and try again.')+'</p><button type="button" id="retry">Retry quiz</button>';document.getElementById('retry').onclick=()=>location.reload();result.scrollIntoView({behavior:'smooth'})});</script></body></html>
