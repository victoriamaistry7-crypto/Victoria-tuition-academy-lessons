<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Loading SkinGuide…</title><style>body{font-family:system-ui;background:#f7f1ec;color:#1d2522;display:grid;place-items:center;min-height:100vh;margin:0}.box{text-align:center}.spin{width:36px;height:36px;border:4px solid #e7ddd3;border-top-color:#466c5c;border-radius:50%;animation:s 1s linear infinite;margin:0 auto 12px}@keyframes s{to{transform:rotate(360deg)}}</style></head><body><div class="box"><div class="spin"></div><b>Opening SkinGuide…</b></div><script>(async()=>{try{const files=['part-00.txt','part-01.txt','part-02.txt','part-03.txt','part-04.txt','part-05.txt','part-06.txt'];const parts=await Promise.all(files.map(f=>fetch(f+'?v=8').then(r=>{if(!r.ok)throw Error(f);return r.text()})));document.open();document.write(parts.join(''));document.close()}catch(e){document.body.innerHTML='<div class="box"><b>SkinGuide could not load.</b><p>Please refresh the page.</p></div>'}})();</script></body></html>
