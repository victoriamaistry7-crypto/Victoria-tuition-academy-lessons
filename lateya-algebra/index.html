<!doctype html>
<html lang="en-ZA">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#5b21b6">
<title>Lateya • Grade 10 Algebra Tutor</title>
<style>
:root{--ink:#111827;--muted:#6b7280;--line:#e5e7eb;--paper:#fff;--bg:#f7f7fb;--purple:#6d28d9;--purple2:#ede9fe;--orange:#ea580c;--orange2:#fff7ed;--green:#166534;--green2:#dcfce7;--red:#991b1b;--red2:#fee2e2;--blue:#1d4ed8;--blue2:#dbeafe;--shadow:0 16px 42px rgba(17,24,39,.10)}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink);line-height:1.55}button,input,textarea{font:inherit}button{cursor:pointer}.hidden{display:none!important}
.gate{position:fixed;inset:0;z-index:9999;display:grid;place-items:center;padding:18px;background:linear-gradient(145deg,#111827,#4c1d95 60%,#8b5cf6)}
.gateCard{width:min(430px,100%);background:#fff;border-radius:26px;padding:28px;box-shadow:0 26px 90px rgba(0,0,0,.30)}
.brand{font-size:.78rem;font-weight:900;letter-spacing:.12em;text-transform:uppercase;color:var(--purple)}
.gate h1{font-size:2rem;line-height:1.05;margin:.5rem 0 1rem}.muted{color:var(--muted)}label{display:block;font-weight:800;margin:.7rem 0 .35rem}
.input{width:100%;min-height:50px;border:1.5px solid #d1d5db;border-radius:13px;padding:12px 14px;font-size:16px;background:#fff;outline:none}.input:focus{border-color:var(--purple);box-shadow:0 0 0 4px var(--purple2)}
.err{min-height:22px;color:var(--red);font-weight:800;font-size:.9rem;margin:.4rem 0}
.btn{border:0;border-radius:13px;min-height:46px;padding:11px 15px;font-weight:900}.primary{background:var(--purple);color:#fff}.secondary{background:var(--purple2);color:#4c1d95}.ghost{background:#fff;border:1px solid var(--line);color:var(--ink)}.dark{background:var(--ink);color:#fff}.btn:disabled{opacity:.45;cursor:not-allowed}
.shell{max-width:960px;margin:auto;padding:0 14px 132px}.top{position:sticky;top:0;z-index:20;background:rgba(247,247,251,.95);backdrop-filter:blur(12px);padding:10px 0;border-bottom:1px solid rgba(229,231,235,.9)}
.toprow{display:flex;align-items:center;justify-content:space-between;gap:12px}.topbrand{font-weight:950;font-size:.9rem}.progressWrap{display:flex;align-items:center;gap:8px;margin-top:8px}.progress{height:8px;background:#e5e7eb;border-radius:999px;overflow:hidden;flex:1}.fill{height:100%;width:0;background:linear-gradient(90deg,var(--purple),#a78bfa);transition:width .2s}.progressText{font-size:.76rem;color:var(--muted);font-weight:800;white-space:nowrap}
main{padding-top:8px}.hero{padding:28px 4px 14px}.kicker{display:inline-flex;padding:6px 10px;border-radius:999px;background:var(--purple2);color:#4c1d95;font-size:.76rem;font-weight:950;letter-spacing:.05em;text-transform:uppercase}
h1{font-size:clamp(2rem,7vw,3.7rem);line-height:1.03;letter-spacing:-.04em;margin:.7rem 0 1rem}h2{font-size:clamp(1.55rem,5vw,2.4rem);line-height:1.1;margin:.5rem 0 1rem}h3{font-size:1.08rem;margin:0 0 .45rem}.lead{font-size:1.04rem;color:#4b5563;max-width:760px}
.card{background:#fff;border:1px solid var(--line);border-radius:20px;padding:18px;box-shadow:var(--shadow);margin:13px 0}.soft{background:#fafafa;box-shadow:none}.purpleCard{background:#faf5ff;border-color:#ddd6fe}.orangeCard{background:var(--orange2);border-color:#fed7aa}
.grid2{display:grid;gap:12px}.outline{display:grid;gap:10px}.outlineItem{border:1px solid var(--line);border-radius:15px;padding:14px;background:#fff}.outlineItem b{display:block;margin-bottom:3px}.math{font-family:"Cambria Math","STIX Two Math",Georgia,serif;font-size:1.2rem;background:#fafafa;border:1px solid var(--line);border-radius:13px;padding:12px 13px;margin:10px 0;overflow-wrap:anywhere}
.worked{border-left:4px solid var(--purple);background:#faf7ff;padding:13px 14px;border-radius:12px;margin:12px 0}.why{border-left:4px solid #22c55e;background:#f0fdf4;padding:12px 14px;border-radius:12px;margin:12px 0}
.steps{display:grid;gap:9px;margin:12px 0}.step{display:grid;grid-template-columns:36px 1fr;gap:10px;align-items:start}.stepNum{width:36px;height:36px;border-radius:10px;background:var(--ink);color:#fff;display:grid;place-items:center;font-weight:950}
.voice{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin:14px 0;padding:12px;border:1px solid #ddd6fe;border-radius:15px;background:#faf5ff}.voice strong{margin-right:auto}.voiceStatus{width:100%;font-size:.8rem;color:var(--muted)}
.quiz{border:1.5px solid #c4b5fd;border-radius:18px;padding:16px;margin-top:16px;background:#fff}.quizTitle{font-weight:950;font-size:1.02rem}.choices{display:grid;gap:9px;margin-top:12px}.choice{width:100%;text-align:left;border:1.5px solid var(--line);background:#fff;border-radius:13px;padding:12px;min-height:48px}.choice:hover{border-color:#c4b5fd}.choice.correct{background:var(--green2);border-color:#86efac}.choice.wrong{background:var(--red2);border-color:#fecaca}
.feedback{display:none;margin-top:11px;padding:11px 13px;border-radius:12px;font-weight:750}.feedback.show{display:block}.feedback.good{background:var(--green2);color:var(--green)}.feedback.bad{background:var(--red2);color:var(--red)}.feedback.hint{background:#fef3c7;color:#92400e}
.examList{display:grid;gap:15px}.exam{border:2px solid var(--ink);border-radius:19px;padding:16px;background:#fff}.examHead{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}.marks{font-weight:950;color:#475569;white-space:nowrap}.badge{display:inline-block;padding:4px 8px;border-radius:999px;background:var(--blue2);color:var(--blue);font-size:.74rem;font-weight:900;margin-right:5px}.examActions{display:flex;gap:8px;flex-wrap:wrap;margin-top:11px}.solution{display:none;border-top:1px solid var(--line);padding-top:14px;margin-top:14px}.solution.show{display:block}.markLine{display:grid;grid-template-columns:38px 1fr;gap:9px;margin:9px 0}.mark{width:38px;height:30px;border-radius:9px;background:var(--ink);color:#fff;display:grid;place-items:center;font-weight:950;font-size:.76rem}.reason{font-size:.8rem;color:var(--muted);margin-top:2px}.examScore{font-size:.84rem;font-weight:900;margin-top:10px}
.reportRow{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}.reportRow:last-child{border:0}.bigScore{font-size:3rem;font-weight:950;color:var(--purple);line-height:1}.pill{display:inline-block;padding:5px 9px;border-radius:999px;background:var(--purple2);color:#4c1d95;font-size:.76rem;font-weight:900}
.nav{position:fixed;z-index:30;left:50%;transform:translateX(-50%);bottom:10px;width:min(920px,calc(100% - 20px));display:grid;grid-template-columns:1fr auto 1fr;gap:8px;background:rgba(17,24,39,.96);padding:8px;border-radius:16px;box-shadow:var(--shadow)}.nav .btn{min-height:48px}.navCenter{display:grid;place-items:center;color:#fff;font-size:.8rem;font-weight:900;min-width:68px}
@media(min-width:700px){.grid2{grid-template-columns:1fr 1fr}.outline{grid-template-columns:1fr 1fr}.card{padding:22px}.shell{padding-left:22px;padding-right:22px}.exam{padding:20px}}
@media(max-width:480px){.shell{padding-left:11px;padding-right:11px}.topbrand{font-size:.8rem}.card{padding:15px;border-radius:16px}.examActions{display:grid;grid-template-columns:1fr}.examActions .btn{width:100%}.voice .btn{flex:1}.navCenter{min-width:52px;font-size:.72rem}}
</style>
</head>
<body>
<section id="gate" class="gate">
  <div class="gateCard">
    <div class="brand">Victoria Tuition Academy</div>
    <h1>Lateya's Grade 10 Algebra Tutor</h1>

    <form id="gateForm">
      <label for="password">Lesson password</label>
      <input id="password" class="input" type="password" autocomplete="current-password" placeholder="Enter password" required>

      <button class="btn dark" style="width:100%" type="submit">Open lesson</button>

  </div>
</section>

<div id="app" class="hidden">
  <div class="shell">

      <div class="toprow">
        <div class="topbrand">Victoria Tuition Academy</div>

        <div class="progress"><div id="fill" class="fill"></div></div>
        <div id="progressText" class="progressText"></div>
      </div>
    </header>
    <main id="main"></main>
  </div>
  <nav class="nav">
    <button id="backBtn" class="btn ghost" type="button">← Back</button>
    <div id="navCenter" class="navCenter"></div>
    <button id="nextBtn" class="btn primary" type="button">Next →</button>
  </nav>
</div>

const screens=[
 {key:'outline',title:'Your complete algebra roadmap',kicker:'START HERE • LESSON OUTLINE',audio:'intro',
  html:()=>'<p class="lead">Lateya, this lesson is not a pile of notes. Every topic follows <b>teach → worked example → your turn → correction → exam application</b>.</p><div class="outline">'+outlineItems.map(x=>'<div class="outlineItem"><b>'+x[0]+'</b><span class="muted">'+x[1]+'</span></div>').join('')+'</div><div class="card purpleCard"><b>How to use it:</b> Try each check before looking at feedback. In Exam Coach, the worked solution stays hidden until you submit an answer.</div>'},
 {key:'language',title:'Algebra language & simplifying',kicker:'FOUNDATIONS',audio:'language',
  html:()=>'<div class="grid2"><div class="card"><h3>Read the expression first</h3><div class="math">4x² − 3x + 7</div><p><b>Terms:</b> 4x², −3x, 7<br><b>Coefficient of x:</b> −3<br><b>Constant:</b> 7</p></div><div class="card"><h3>Like terms</h3><p>Terms combine only when the variable part is identical.</p><div class="math">5x + 2x = 7x<br>5x + 2x² cannot combine</div></div></div><div class="worked"><b>Worked example</b><div class="math">7x² + 4x − 2x² + 9x − 5<br>= 5x² + 13x − 5</div><span class="muted">Collect x² terms, x terms and constants separately.</span></div>',
  quiz:{type:'input',prompt:'Simplify: 8x + 4 − 3x + 9',answers:['5x+13'],hint:'Combine the x terms, then the constants.',explain:'8x−3x=5x and 4+9=13, so the answer is 5x+13.'}},
 {key:'expansion',title:'Expansion',kicker:'BRACKETS',audio:'expansion',
  html:()=>'<div class="card"><h3>Single bracket</h3><div class="math">−2(3x − 5) = −6x + 10</div><p>The outside factor multiplies <b>every</b> term inside.</p></div><div class="card"><h3>Two brackets</h3><div class="math">(x+3)(x+5)<br>= x²+5x+3x+15<br>= x²+8x+15</div><p>Every term in the first bracket multiplies every term in the second.</p></div><div class="why"><b>Special product:</b> (a−b)(a+b)=a²−b² because the middle terms cancel.</div>',
  quiz:{type:'mcq',prompt:'Expand and simplify: 2(x−3)+4(x+1)',choices:['6x−2','6x+10','2x−2','8x−2'],answer:0,explain:'2x−6+4x+4 = 6x−2.'}},
 {key:'exponents',title:'Exponents',kicker:'EXPONENT LAWS',audio:'exponents',
  html:()=>'<div class="card"><div class="math">aᵐ·aⁿ=aᵐ⁺ⁿ<br>aᵐ÷aⁿ=aᵐ⁻ⁿ<br>(aᵐ)ⁿ=aᵐⁿ<br>a⁰=1 (a≠0)<br>a⁻ⁿ=1/aⁿ</div></div><div class="worked"><b>Example</b><div class="math">(2x³)(−3x²)=−6x⁵</div><span class="muted">Multiply coefficients; add exponents only because the base x is the same.</span></div><div class="card soft"><b>Simple exponential equations:</b> if you can rewrite both sides with the same base, compare exponents. Example: 2ˣ=8=2³, so x=3.</div>',
  quiz:{type:'input',prompt:'Simplify: y⁷ ÷ y³',answers:['y^4','y4','y⁴'],hint:'Same base and division means subtract exponents.',explain:'7−3=4, so y⁴.'}},
 {key:'factor',title:'Factorisation',kicker:'REVERSE EXPANSION',audio:'factor',
  html:()=>'<div class="card"><h3>Always ask in this order</h3><div class="steps"><div class="step"><div class="stepNum">1</div><div><b>Common factor?</b><div class="math">12x²−8x=4x(3x−2)</div></div></div><div class="step"><div class="stepNum">2</div><div><b>Difference of squares?</b><div class="math">x²−25=(x−5)(x+5)</div></div></div><div class="step"><div class="stepNum">3</div><div><b>Trinomial?</b><div class="math">x²+7x+12=(x+3)(x+4)</div></div></div></div></div><div class="card soft"><b>Also know:</b> grouping in pairs and the patterns a³−b³=(a−b)(a²+ab+b²) and a³+b³=(a+b)(a²−ab+b²).</div>',
  quiz:{type:'input',prompt:'Factorise fully: x² + 5x + 6',answers:['(x+2)(x+3)','(x+3)(x+2)'],hint:'Find two numbers that multiply to 6 and add to 5.',explain:'2 and 3 work, so (x+2)(x+3).'}},
 {key:'fractions',title:'Algebraic fractions',kicker:'FACTORISE BEFORE CANCELLING',audio:'fractions',
  html:()=>'<div class="worked"><b>Example</b><div class="math">(x²−9)/(x²+3x)</div><p>Factorise:</p><div class="math">(x−3)(x+3) / [x(x+3)]</div><p>Cancel the common <b>factor</b> (x+3):</p><div class="math">(x−3)/x, &nbsp; x≠0,−3</div></div><div class="why"><b>Never cancel terms across + or −.</b> Cancellation works with factors that multiply the whole numerator and denominator.</div>',
  quiz:{type:'mcq',prompt:'Simplify: (x²−16)/(x−4), where x≠4',choices:['x−4','x+4','x²+4','1'],answer:1,explain:'x²−16=(x−4)(x+4). Cancel the factor x−4, leaving x+4.'}},
 {key:'linear',title:'Linear equations',kicker:'KEEP THE BALANCE',audio:'equations',
  html:()=>'<div class="worked"><b>Example</b><div class="math">5x−7=18<br>5x=25<br>x=5</div><p>Every operation must preserve equality.</p></div><div class="grid2"><div class="card"><h3>Brackets</h3><div class="math">3(x−2)=12<br>x−2=4<br>x=6</div></div><div class="card"><h3>Fractions</h3><div class="math">x/3+2=5<br>x/3=3<br>x=9</div><p>For harder fraction equations, multiply every term by the lowest common denominator.</p></div></div>',
  quiz:{type:'input',prompt:'Solve: 4(x+1)=28',answers:['6','x=6'],hint:'Divide both sides by 4 first.',explain:'x+1=7, therefore x=6.'}},
 {key:'quadratic',title:'Quadratic equations',kicker:'FACTORISE • ZERO PRODUCT',audio:'equations',
  html:()=>'<div class="worked"><b>Solve:</b><div class="math">x²+5x+6=0<br>(x+2)(x+3)=0<br>x+2=0 or x+3=0<br>x=−2 or x=−3</div></div><div class="why"><b>Why two answers?</b> If A×B=0, at least one factor must equal zero.</div>',
  quiz:{type:'input',prompt:'Solve x²−5x+6=0. Enter both solutions separated by a comma.',answers:['2,3','3,2'],hint:'Factorise into (x−2)(x−3).',explain:'(x−2)(x−3)=0, so x=2 or x=3.'}},
 {key:'simultaneous',title:'Simultaneous & literal equations',kicker:'TWO IMPORTANT SKILLS',audio:'simultaneous',
  html:()=>'<div class="grid2"><div class="card"><h3>Simultaneous equations</h3><div class="math">x+y=7<br>x−y=1</div><p>Add: 2x=8 → x=4. Substitute back: y=3.</p><p class="muted">Use elimination or substitution.</p></div><div class="card"><h3>Changing the subject</h3><div class="math">V=πr²h<br>h=V/(πr²)</div><p>Use inverse operations until the requested letter is alone.</p></div></div>',
  quiz:{type:'input',prompt:'Given x+y=10 and x−y=2, what is x?',answers:['6','x=6'],hint:'Add the equations so y cancels.',explain:'2x=12, so x=6. Then y=4.'}},
 {key:'inequality',title:'Linear inequalities',kicker:'WATCH THE SIGN',audio:'inequality',

  quiz:{type:'input',prompt:'Solve: −2x ≤ 10',answers:['x>=-5','x≥-5'],hint:'Divide by −2 and reverse the sign.',explain:'x≥−5.'}},
 {key:'word',title:'Word problems',kicker:'TRANSLATE BEFORE YOU SOLVE',audio:'word',
  html:()=>'<div class="worked"><b>Problem:</b> “Three more than twice a number is 17.”<div class="steps"><div class="step"><div class="stepNum">1</div><div>Let the number be x.</div></div><div class="step"><div class="stepNum">2</div><div>Twice the number → 2x.</div></div><div class="step"><div class="stepNum">3</div><div>Three more → 2x+3.</div></div><div class="step"><div class="stepNum">4</div><div>Equation: 2x+3=17.</div></div><div class="step"><div class="stepNum">5</div><div>Solve: x=7 and check the story.</div></div></div></div>',
  quiz:{type:'mcq',prompt:'“Five less than three times a number is 19.” Which equation matches?',choices:['3x+5=19','5x−3=19','3x−5=19','3(x−5)=19'],answer:2,explain:'Three times a number is 3x; five less means subtract 5.'}},
 {key:'exam',title:'Exam Coach',kicker:'ANSWER → MARK → LEARN THE METHOD',audio:'exam',exam:true},
 {key:'report',title:'Your algebra progress',kicker:'LESSON REPORT',report:true}

];

const state={index:0,checks:{},exam:{},audio:null};
try{const s=JSON.parse(localStorage.getItem('lateya-algebra-v3')||'null');if(s){state.index=s.index||0;state.checks=s.checks||{};state.exam=s.exam||{};}}catch(e){}
const main=document.getElementById('main'),fill=document.getElementById('fill'),progressText=document.getElementById('progressText'),navCenter=document.getElementById('navCenter'),backBtn=document.getElementById('backBtn'),nextBtn=document.getElementById('nextBtn');
function save(){try{localStorage.setItem('lateya-algebra-v3',JSON.stringify({index:state.index,checks:state.checks,exam:state.exam}));}catch(e){}}
function norm(v){return String(v||'').toLowerCase().replace(/\s+/g,'').replace(/−/g,'-').replace(/≥/g,'>=').replace(/≤/g,'<=').replace(/⁴/g,'^4');}
function matches(v,arr){const n=norm(v);return arr.some(a=>norm(a)===n)}
function voiceBlock(key){
 const src=AUDIO[key];
 if(!src)return '';
 return '<div class="voice"><strong>🎧 Voice tutor</strong><button type="button" class="btn primary" id="playVoice">▶ Play</button><button type="button" class="btn ghost" id="restartVoice">↺ Restart</button><div id="voiceStatus" class="voiceStatus">Tap Play. This uses a real audio clip, not browser text-to-speech.</div><audio id="voiceAudio" preload="metadata" src="'+src+'"></audio></div>';
}
function quizBlock(q,key){
 if(!q)return '';
 let body='<div class="quiz"><div class="quizTitle">Your turn</div><p>'+q.prompt+'</p>';
 if(q.type==='mcq') body+='<div class="choices">'+q.choices.map((c,i)=>'<button type="button" class="choice" data-choice="'+i+'">'+c+'</button>').join('')+'</div>';
 else body+='<input class="input" id="quizInput" placeholder="Type your answer"><div class="examActions"><button type="button" class="btn dark" id="checkInput">Check answer</button><button type="button" class="btn secondary" id="hintBtn">Hint</button></div>';
 body+='<div id="feedback" class="feedback" aria-live="polite"></div></div>';
 return body;
}
function renderExam(){
 return '<p class="lead">These are exam-style practice questions. <b>Do not open the worked solution first.</b> Write your working on paper, enter your final answer, submit it, then compare your method with the marking guide.</p>'+voiceBlock('exam')+'<div class="examList">'+examQuestions.map(q=>{
  const saved=state.exam[q.id]||{};
  return '<section class="exam" data-exam="'+q.id+'"><div class="examHead"><div><span class="badge">'+q.topic+'</span><h3 style="margin-top:9px">'+q.prompt+'</h3></div><div class="marks">['+q.marks+']</div></div><label>Final answer</label><input class="input examInput" '+(saved.submitted?'disabled':'')+' value="'+(saved.value||'').replace(/"/g,'&quot;')+'" placeholder="Enter your final answer"><div class="examActions"><button type="button" class="btn dark submitExam" '+(saved.submitted?'disabled':'')+'>Submit to mark</button><button type="button" class="btn secondary revealExam" '+(saved.submitted?'':'disabled')+'>Show step-by-step solution</button></div><div class="feedback '+(saved.submitted?'show '+(saved.correct?'good':'bad'):'')+'">'+(saved.submitted?(saved.correct?'Final answer correct. Compare your working below to see whether you earned every method mark.':'Final answer is not correct yet. Open the solution and find the first line where your method differs.'):'')+'</div><div class="examScore">'+(saved.submitted?'Final-answer check: '+(saved.correct?'✓ correct':'✗ incorrect')+'. Full '+q.marks+' marks depend on the working shown in the guide.':'')+'</div><div class="solution"><h3>Examiner-style marking guide</h3>'+q.steps.map(s=>'<div class="markLine"><div class="mark">'+s[0]+'</div><div><b>'+s[1]+'</b><div class="reason">'+s[2]+'</div></div></div>').join('')+'</div></section>';
 }).join('')+'</div>';
}
function renderReport(){
 const lessonKeys=screens.filter(s=>s.quiz).map(s=>s.key);
 const attempted=lessonKeys.filter(k=>state.checks[k]).length;
 const correct=lessonKeys.filter(k=>state.checks[k]&&state.checks[k].correct).length;
 const exAttempt=examQuestions.filter(q=>state.exam[q.id]&&state.exam[q.id].submitted).length;
 const exCorrect=examQuestions.filter(q=>state.exam[q.id]&&state.exam[q.id].correct).length;
 const pct=attempted?Math.round(correct/attempted*100):0;
 return '<div class="grid2"><div class="card"><div class="bigScore">'+pct+'%</div><p class="muted">Lesson-check accuracy: '+correct+'/'+attempted+'</p><p><b>Exam final answers:</b> '+exCorrect+'/'+exAttempt+' correct</p></div><div class="card"><h3>How to use this report</h3><p>'+(pct>=80?'Strong foundation. Revisit any incorrect topic, then repeat Exam Coach without looking at the solutions.':pct>=60?'Progress is developing. Re-do the incorrect lesson checks and explain the worked examples aloud.':'Work one section at a time with Victoria. Do not rush to the exam set until the foundation checks are comfortable.')+'</p></div></div><div class="card"><h3>Topic checks</h3>'+screens.filter(s=>s.quiz).map(s=>{const r=state.checks[s.key];return '<div class="reportRow"><span>'+s.title+'</span><span class="pill">'+(r?(r.correct?'Correct':'Revisit'):'Not attempted')+'</span></div>'}).join('')+'</div><div class="card"><h3>Exam Coach</h3>'+examQuestions.map(q=>{const r=state.exam[q.id];return '<div class="reportRow"><span>'+q.topic+' ['+q.marks+']</span><span class="pill">'+(r&&r.submitted?(r.correct?'Final answer correct':'Revisit method'):'Not attempted')+'</span></div>'}).join('')+'</div>';
}
function render(){
 const s=screens[state.index];
 if(state.audio){state.audio.pause();state.audio=null}
 let body=s.exam?renderExam():s.report?renderReport():s.html();
 main.innerHTML='<section class="hero"><span class="kicker">'+s.kicker+'</span><h1>'+s.title+'</h1></section>'+(s.audio&&!s.exam?voiceBlock(s.audio):'')+body+(s.quiz?quizBlock(s.quiz,s.key):'');
 const p=Math.round((state.index)/(screens.length-1)*100);fill.style.width=p+'%';progressText.textContent=(state.index+1)+' / '+screens.length;navCenter.textContent=(state.index+1)+' / '+screens.length;backBtn.disabled=state.index===0;nextBtn.textContent=state.index===screens.length-1?'Back to start':'Next →';
 attachVoice();attachQuiz(s);if(s.exam)attachExam();save();window.scrollTo({top:0,behavior:'smooth'});
}
function attachVoice(){
 const audio=document.getElementById('voiceAudio'),play=document.getElementById('playVoice'),restart=document.getElementById('restartVoice'),status=document.getElementById('voiceStatus');
 if(!audio||!play)return;state.audio=audio;
 play.addEventListener('click',async()=>{try{if(audio.paused){await audio.play();play.textContent='⏸ Pause';status.textContent='Playing tutor explanation…'}else{audio.pause();play.textContent='▶ Play';status.textContent='Paused.'}}catch(e){status.textContent='Audio was blocked here. Open the lesson in Chrome, then tap Play again.'}});
 restart.addEventListener('click',async()=>{audio.currentTime=0;try{await audio.play();play.textContent='⏸ Pause';status.textContent='Restarted.'}catch(e){status.textContent='Open in Chrome and tap Play once to allow audio.'}});
 audio.addEventListener('ended',()=>{play.textContent='▶ Play';status.textContent='Explanation finished. Now try the example or question.'});
}
function attachQuiz(s){
 if(!s.quiz)return;const q=s.quiz,fb=document.getElementById('feedback');const saved=state.checks[s.key];
 if(q.type==='mcq'){
  const buttons=[...document.querySelectorAll('.choice')];
  if(saved){buttons.forEach((b,i)=>{b.disabled=true;if(i===q.answer)b.classList.add('correct');if(i===saved.choice&&i!==q.answer)b.classList.add('wrong')});fb.className='feedback show '+(saved.correct?'good':'bad');fb.textContent=(saved.correct?'Correct. ':'Not quite. ')+q.explain;}
  buttons.forEach((b,i)=>b.addEventListener('click',()=>{const ok=i===q.answer;state.checks[s.key]={correct:ok,choice:i};buttons.forEach((x,j)=>{x.disabled=true;if(j===q.answer)x.classList.add('correct');if(j===i&&!ok)x.classList.add('wrong')});fb.className='feedback show '+(ok?'good':'bad');fb.textContent=(ok?'Correct. ':'Not quite. ')+q.explain;save()}));
 }else{
  const input=document.getElementById('quizInput'),check=document.getElementById('checkInput'),hint=document.getElementById('hintBtn');
  if(saved){input.value=saved.value||'';input.disabled=true;check.disabled=true;hint.disabled=true;fb.className='feedback show '+(saved.correct?'good':'bad');fb.textContent=(saved.correct?'Correct. ':'Not quite. ')+q.explain;}
  check.addEventListener('click',()=>{if(!input.value.trim()){fb.className='feedback show hint';fb.textContent='Type an answer first.';return}const ok=matches(input.value,q.answers);state.checks[s.key]={correct:ok,value:input.value};input.disabled=true;check.disabled=true;hint.disabled=true;fb.className='feedback show '+(ok?'good':'bad');fb.textContent=(ok?'Correct. ':'Not quite. ')+q.explain;save()});
  hint.addEventListener('click',()=>{fb.className='feedback show hint';fb.textContent='Hint: '+q.hint});
 }
}
function attachExam(){
 document.querySelectorAll('.exam').forEach(box=>{
  const id=box.dataset.exam,q=examQuestions.find(x=>x.id===id),input=box.querySelector('.examInput'),submit=box.querySelector('.submitExam'),reveal=box.querySelector('.revealExam'),fb=box.querySelector('.feedback'),solution=box.querySelector('.solution');
  submit.addEventListener('click',()=>{if(!input.value.trim()){fb.className='feedback show hint';fb.textContent='Write a final answer first. Do the working on paper as if this were the exam.';return}const ok=matches(input.value,q.answers);state.exam[id]={submitted:true,correct:ok,value:input.value};input.disabled=true;submit.disabled=true;reveal.disabled=false;fb.className='feedback show '+(ok?'good':'bad');fb.textContent=ok?'Final answer correct. Now reveal the marking guide and check whether your working earned every method mark.':'Final answer is not correct yet. Reveal the marking guide and find the first step where your working changed.';save()});
  reveal.addEventListener('click',()=>{solution.classList.add('show');reveal.disabled=true;solution.scrollIntoView({behavior:'smooth',block:'start'})});
 });
}
backBtn.addEventListener('click',()=>{if(state.index>0){state.index--;render()}});
nextBtn.addEventListener('click',()=>{state.index=state.index===screens.length-1?0:state.index+1;render()});
document.getElementById('outlineBtn').addEventListener('click',()=>{state.index=0;render()});
async function hashText(v){const data=new TextEncoder().encode(v);const digest=await crypto.subtle.digest('SHA-256',data);return [...new Uint8Array(digest)].map(b=>b.toString(16).padStart(2,'0')).join('')}
document.getElementById('gateForm').addEventListener('submit',async e=>{e.preventDefault();const v=document.getElementById('password').value,err=document.getElementById('gateError');err.textContent='';try{if(await hashText(v)===PASS_HASH){sessionStorage.setItem('lateya-access','1');document.getElementById('gate').classList.add('hidden');document.getElementById('app').classList.remove('hidden');render()}else err.textContent='That password is not correct.'}catch(ex){err.textContent='Open this link in Chrome and try again.'}});
if(sessionStorage.getItem('lateya-access')==='1'){document.getElementById('gate').classList.add('hidden');document.getElementById('app').classList.remove('hidden');render()}
})();
</script>
</body>
</html>
