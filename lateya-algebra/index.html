<!doctype html>
<html lang="en-ZA">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#5b21b6">
<title>Lateya • Algebra Studio</title>
<style>
:root{
 --ink:#171321;--muted:#766e80;--line:#e9e3ef;--paper:#fff;--wash:#faf8fc;
 --violet:#6d28d9;--violet2:#8b5cf6;--violet3:#ede9fe;--plum:#3b155f;
 --green:#16754a;--greenbg:#e9f9f0;--red:#a12a2a;--redbg:#fff0f0;
 --amber:#9a5b10;--amberbg:#fff6df;--shadow:0 20px 60px rgba(54,32,76,.12);
}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:
radial-gradient(circle at 10% 0%,#f1eafe 0,transparent 30%),linear-gradient(#fbfafd,#f7f4fa);color:var(--ink);line-height:1.55}
button,input{font:inherit}button{cursor:pointer}.hidden{display:none!important}
.gate{position:fixed;inset:0;z-index:9999;display:grid;place-items:center;padding:18px;background:
radial-gradient(circle at 80% 20%,rgba(255,255,255,.17),transparent 28%),linear-gradient(145deg,#1d102a,#4c1d95 58%,#8b5cf6)}
.gateCard{width:min(430px,100%);background:rgba(255,255,255,.97);border:1px solid rgba(255,255,255,.6);border-radius:30px;padding:30px;box-shadow:0 28px 90px rgba(0,0,0,.30)}
.miniBrand{font-size:.74rem;font-weight:950;letter-spacing:.15em;text-transform:uppercase;color:var(--violet)}
.gate h1{font-size:2.05rem;line-height:1.04;letter-spacing:-.03em;margin:.6rem 0 .8rem}
.muted{color:var(--muted)}
label{display:block;font-weight:850;margin:.8rem 0 .35rem}
.field{width:100%;min-height:52px;border:1.5px solid #d8cfdf;border-radius:15px;padding:12px 14px;font-size:16px;background:#fff;outline:none;transition:.18s}
.field:focus{border-color:var(--violet2);box-shadow:0 0 0 4px var(--violet3)}
.err{min-height:22px;color:var(--red);font-weight:800;font-size:.88rem;margin:.45rem 0}
.btn{border:0;min-height:48px;border-radius:15px;padding:11px 17px;font-weight:900;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:transform .16s,box-shadow .16s,background .16s}
.btn:active{transform:scale(.985)}.btn:disabled{opacity:.42;cursor:not-allowed}
.btnPrimary{background:linear-gradient(135deg,var(--violet),var(--violet2));color:#fff;box-shadow:0 9px 22px rgba(109,40,217,.22)}
.btnSoft{background:#f2edf8;color:#4b1f73}.btnGhost{background:#fff;border:1px solid var(--line);color:var(--ink)}
.btnDark{background:#1b1622;color:#fff}.btnGood{background:var(--greenbg);color:var(--green)}
.app{max-width:1040px;margin:auto;padding:0 14px 128px}
.header{position:sticky;top:0;z-index:50;background:rgba(250,248,252,.91);backdrop-filter:blur(16px);border-bottom:1px solid rgba(226,217,234,.78);padding:10px 0}
.headRow{display:flex;align-items:center;gap:10px;justify-content:space-between}.brand{font-size:.86rem;font-weight:950;white-space:nowrap}
.brand em{font-style:normal;color:var(--violet)}
.topicBtn{min-height:38px;border:0;border-radius:999px;padding:8px 12px;background:#fff;border:1px solid var(--line);font-weight:850;color:#4b4250}
.progressRow{display:flex;align-items:center;gap:9px;margin-top:9px}.progressTrack{height:7px;flex:1;background:#e8e1ed;border-radius:99px;overflow:hidden}.progressFill{height:100%;width:0;background:linear-gradient(90deg,var(--violet),#b79af2);transition:width .25s}.progressLabel{font-size:.73rem;font-weight:850;color:var(--muted);white-space:nowrap}
.hero{padding:28px 3px 14px}.eyebrow{display:inline-flex;align-items:center;gap:7px;border:1px solid #ddd1f3;background:#f5f0ff;color:#55209a;padding:6px 10px;border-radius:999px;font-size:.72rem;font-weight:950;letter-spacing:.08em;text-transform:uppercase}
h1{font-size:clamp(2rem,6.5vw,3.8rem);line-height:1.02;letter-spacing:-.045em;margin:.75rem 0 .65rem}
h2{font-size:clamp(1.45rem,5vw,2.4rem);line-height:1.08;letter-spacing:-.025em;margin:.5rem 0 1rem}h3{font-size:1.05rem;margin:0 0 .4rem}
.lead{font-size:1.04rem;color:#554d5f;max-width:760px}
.card{background:rgba(255,255,255,.97);border:1px solid var(--line);border-radius:24px;padding:18px;margin:13px 0;box-shadow:var(--shadow)}
.flat{box-shadow:none}.lav{background:linear-gradient(145deg,#fbf8ff,#f5f0ff);border-color:#e0d4f1}.warm{background:#fffaf4;border-color:#f1dfca}
.grid2{display:grid;gap:13px}.outlineGrid{display:grid;gap:10px;margin-top:14px}.outlineItem{display:grid;grid-template-columns:42px 1fr;gap:11px;align-items:start;border:1px solid var(--line);border-radius:18px;padding:14px;background:#fff}
.outNum{width:38px;height:38px;border-radius:12px;background:linear-gradient(145deg,#ede9fe,#ddd6fe);color:#55209a;display:grid;place-items:center;font-weight:950}
.outlineItem strong{display:block;margin-bottom:2px}.small{font-size:.82rem;color:var(--muted)}
.tutorStage{background:linear-gradient(145deg,#21152e,#3c1b5c 58%,#5d2c8c);color:#fff;border-radius:28px;padding:17px;box-shadow:0 22px 60px rgba(44,20,66,.22);margin:13px 0;overflow:hidden}
.tutorTop{display:flex;gap:12px;align-items:center}.avatar{width:49px;height:49px;flex:0 0 49px;border-radius:50%;background:linear-gradient(145deg,#fff,#e8d9ff);color:#5b21b6;display:grid;place-items:center;font-weight:950;box-shadow:inset 0 0 0 1px rgba(255,255,255,.7)}
.tutorMeta{min-width:0;flex:1}.tutorName{font-size:.92rem;font-weight:950}.tutorSub{font-size:.76rem;color:#d8cbe4}.wave{display:flex;gap:3px;align-items:center;height:24px}.wave i{width:3px;height:8px;border-radius:9px;background:#cab6e6;display:block}.playing .wave i{animation:bounce .75s ease-in-out infinite alternate}.playing .wave i:nth-child(2){animation-delay:.12s}.playing .wave i:nth-child(3){animation-delay:.24s}.playing .wave i:nth-child(4){animation-delay:.36s}
@keyframes bounce{to{height:22px;background:#fff}}
.audioRow{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:13px}.audioBtn{min-height:47px;border:1px solid rgba(255,255,255,.16);border-radius:15px;background:rgba(255,255,255,.10);color:#fff;font-weight:900}.audioBtn.main{background:#fff;color:#3c1b5c}.audioStatus{font-size:.77rem;color:#d7cce0;margin-top:9px}
.caption{margin-top:12px;padding:11px 12px;background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.12);border-radius:14px;font-size:.9rem;color:#f3ebfb;min-height:48px}
.board{position:relative;border-radius:24px;background:#fff;border:1px solid var(--line);padding:18px;margin:13px 0;overflow:hidden}.board::before{content:"";position:absolute;inset:0;background:linear-gradient(transparent 31px,rgba(109,40,217,.035) 32px);background-size:100% 32px;pointer-events:none}
.boardTitle{font-size:.77rem;color:var(--muted);font-weight:950;text-transform:uppercase;letter-spacing:.08em;margin-bottom:11px;position:relative}
.cue{position:relative;opacity:.26;transform:translateY(10px) scale(.985);filter:blur(.15px);transition:opacity .45s,transform .45s,filter .45s,background .45s,border-color .45s}
.cue.active{opacity:1;transform:translateY(0) scale(1);filter:none}.cue.past{opacity:.65;transform:none;filter:none}
.mathRow{font-family:"Cambria Math","STIX Two Math",Georgia,serif;font-size:clamp(1.32rem,5vw,2.1rem);font-weight:650;line-height:1.35;padding:11px 12px;border-radius:15px;border:1px solid transparent;margin:8px 0}
.mathRow.active{background:#f7f1ff;border-color:#d9c8f2}.mathNote{font-family:Inter,system-ui,sans-serif;font-size:.82rem;font-weight:600;color:var(--muted);margin-top:3px}
.frac{display:inline-flex;vertical-align:middle;flex-direction:column;align-items:stretch;text-align:center;line-height:1.08;margin:0 .12em;min-width:2.2em}.frac .num{border-bottom:1.7px solid currentColor;padding:0 .18em .12em}.frac .den{padding:.12em .18em 0}
.eqArrow{display:inline-block;margin:0 .18em;color:var(--violet)}
.token{display:inline-block;border-radius:9px;padding:1px 4px;transition:.35s}.cue.active .tokenFocus{background:#eadcff;color:#4c1d95;box-shadow:0 0 0 2px #d8c1fb}
.explainGrid{display:grid;gap:10px}.explainItem{border:1px solid var(--line);border-radius:17px;padding:14px;background:#fff}.explainItem b{display:block;margin-bottom:4px}.why{border-left:4px solid #6d28d9;background:#faf6ff;border-radius:13px;padding:12px 14px;margin-top:12px}
.practice{border:1.5px solid #d9c8ef;background:#fff;border-radius:22px;padding:16px;margin:15px 0}.practiceHead{display:flex;justify-content:space-between;gap:8px;align-items:center}.practiceTag{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:#5b21b6;background:#f1e9ff;padding:5px 8px;border-radius:999px;font-weight:950}
.question{font-size:1.02rem;font-weight:850;margin:13px 0}.choices{display:grid;gap:9px}.choice{width:100%;min-height:50px;text-align:left;border:1.5px solid var(--line);border-radius:14px;background:#fff;padding:12px 13px;color:var(--ink);font-weight:700;transition:.16s}.choice:hover{border-color:#cdb7ec;background:#fcfaff}.choice.correct{border-color:#79c49b;background:var(--greenbg);color:var(--green)}.choice.wrong{border-color:#edacac;background:var(--redbg);color:var(--red)}
.actionRow{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}.feedback{display:none;margin-top:11px;padding:11px 13px;border-radius:13px;font-weight:700}.feedback.show{display:block}.feedback.good{background:var(--greenbg);color:var(--green)}.feedback.bad{background:var(--redbg);color:var(--red)}.feedback.hint{background:var(--amberbg);color:var(--amber)}
.examIntro{background:linear-gradient(145deg,#fbf9ff,#f1ebfb);border:1px solid #dfd1f2;border-radius:24px;padding:18px;margin:13px 0}.examList{display:grid;gap:16px}.examPaper{background:#fff;border:1px solid #d8d3dc;border-radius:20px;padding:18px;box-shadow:0 12px 30px rgba(28,20,36,.06)}
.examTop{display:flex;justify-content:space-between;gap:14px;border-bottom:1px solid #ece8ef;padding-bottom:11px;margin-bottom:14px}.examNo{font-size:.75rem;letter-spacing:.1em;text-transform:uppercase;font-weight:950;color:#514759}.examMarks{font-family:Georgia,serif;font-weight:800;color:#403747;white-space:nowrap}
.examQ{font-family:"Cambria Math","STIX Two Math",Georgia,serif;font-size:1.25rem;line-height:1.45;margin:8px 0 14px}.answerBox{margin-top:12px}.solution{display:none;margin-top:16px;padding-top:15px;border-top:1px dashed #d6cfdb}.solution.show{display:block}
.memoTitle{font-size:.76rem;letter-spacing:.1em;text-transform:uppercase;font-weight:950;color:#5b21b6;margin-bottom:10px}.markStep{display:grid;grid-template-columns:44px 1fr;gap:10px;margin:10px 0}.markChip{height:31px;border-radius:9px;background:#21172a;color:#fff;display:grid;place-items:center;font-weight:900;font-size:.73rem}.reason{font-size:.79rem;color:var(--muted);margin-top:2px}
.reportScore{font-size:3.1rem;line-height:1;font-weight:950;color:var(--violet)}.reportRow{display:flex;justify-content:space-between;gap:10px;padding:11px 0;border-bottom:1px solid var(--line)}.reportRow:last-child{border:0}.pill{background:#f1e9ff;color:#55209a;border-radius:999px;padding:5px 9px;font-size:.74rem;font-weight:900;white-space:nowrap}
.bottomNav{position:fixed;z-index:60;left:50%;transform:translateX(-50%);bottom:10px;width:min(1010px,calc(100% - 18px));background:rgba(28,21,35,.94);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.08);border-radius:20px;padding:8px;display:grid;grid-template-columns:auto 1fr auto;gap:8px;box-shadow:0 16px 50px rgba(25,13,34,.25)}
.navBack{width:50px;min-height:50px;border-radius:15px;border:0;background:#3b3243;color:#fff;font-size:1.2rem;font-weight:900}.navInfo{display:grid;place-items:center;color:#ddd2e4;font-size:.76rem;font-weight:850;text-align:center}.navNext{min-height:50px;border:0;border-radius:15px;padding:0 19px;background:linear-gradient(135deg,#7c3aed,#a66cf0);color:#fff;font-weight:950;box-shadow:0 8px 18px rgba(124,58,237,.22)}
.drawer{position:fixed;z-index:90;inset:0;background:rgba(22,14,28,.38);backdrop-filter:blur(5px);display:none;padding:64px 12px 90px}.drawer.show{display:block}.drawerPanel{max-width:680px;max-height:100%;overflow:auto;margin:auto;background:#fff;border:1px solid var(--line);border-radius:26px;padding:17px;box-shadow:var(--shadow)}.drawerHead{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:11px}.drawerList{display:grid;gap:8px}.drawerItem{width:100%;display:grid;grid-template-columns:36px 1fr;gap:10px;align-items:center;text-align:left;border:1px solid var(--line);background:#fff;border-radius:15px;padding:10px}.drawerItem.active{border-color:#c9adef;background:#faf7ff}.drawerNum{width:34px;height:34px;border-radius:11px;background:#efe7f7;color:#55209a;display:grid;place-items:center;font-weight:900}
@media(min-width:720px){.grid2{grid-template-columns:1fr 1fr}.outlineGrid{grid-template-columns:1fr 1fr}.explainGrid{grid-template-columns:1fr 1fr}.card,.examPaper{padding:22px}.tutorStage{padding:20px}.board{padding:22px}.audioRow{grid-template-columns:auto auto 1fr}.audioStatus{align-self:center;margin:0 0 0 4px}}
@media(max-width:520px){.app{padding-left:10px;padding-right:10px}.brand{font-size:.76rem}.topicBtn{font-size:.76rem;padding:7px 9px}.hero{padding-top:22px}.card,.board,.practice,.examPaper{border-radius:18px;padding:14px}.tutorStage{border-radius:21px;padding:14px}.mathRow{font-size:1.42rem;padding:10px 8px}.audioRow{grid-template-columns:1fr 1fr}.actionRow{display:grid;grid-template-columns:1fr}.actionRow .btn{width:100%}.examTop{align-items:flex-start}.navNext{padding:0 14px}.bottomNav{border-radius:17px}.drawer{padding-top:54px}.outlineGrid{grid-template-columns:1fr}}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;animation:none!important;transition:none!important}}
</style>
</head>
<body>
<section id="gate" class="gate">
 <div class="gateCard">
  <div class="miniBrand">Victoria Tuition Academy</div>
  <h1>Lateya's Algebra Studio</h1>
  <p class="muted">A private, guided Grade 10 lesson with a voice tutor and exam coaching.</p>
  <form id="gateForm">
   <label for="password">Lesson password</label>
   <input id="password" class="field" type="password" autocomplete="current-password" placeholder="Enter password" required>
   <div id="gateError" class="err" aria-live="polite"></div>
   <button class="btn btnPrimary" style="width:100%" type="submit">Enter lesson <span>→</span></button>
  </form>
 </div>
</section>

<div id="app" class="hidden">
 <div class="app">
  <header class="header">
   <div class="headRow">
    <div class="brand">Victoria Tuition <em>Academy</em></div>
    <button id="topicsBtn" class="topicBtn" type="button">☰ Topics</button>
   </div>
   <div class="progressRow">
    <div class="progressTrack"><div id="progressFill" class="progressFill"></div></div>
    <div id="progressLabel" class="progressLabel"></div>
   </div>
  </header>
  <main id="main"></main>
 </div>
 <div id="drawer" class="drawer" aria-hidden="true">
  <div class="drawerPanel">
   <div class="drawerHead"><div><div class="miniBrand">Lesson map</div><h3 style="margin-top:4px">Jump to a topic</h3></div><button id="closeDrawer" class="btn btnGhost" type="button">Close</button></div>
   <div id="drawerList" class="drawerList"></div>
  </div>
 </div>
 <nav class="bottomNav">
  <button id="backBtn" class="navBack" type="button" aria-label="Previous topic">←</button>
  <div id="navInfo" class="navInfo"></div>
  <button id="nextBtn" class="navNext" type="button">Continue →</button>
 </nav>
</div>

<script>
(()=>{
const PASS_HASH='2de6bab1fc74cc4e4ca469e90e22a37c00db1cb7a5dd2e89a1fee12c3a5f2756';
const AUDIO={
 intro:'https://storage.googleapis.com/adm--audio-playback--7d--public/mcp-preview/afca3dbb-b599-4b81-9a7a-db150c11ff51.mp3',
 language:'https://storage.googleapis.com/adm--audio-playback--7d--public/mcp-preview/659306ba-d84f-43b6-a87d-ede3bb89b08b.mp3',
 expansion:'https://storage.googleapis.com/adm--audio-playback--7d--public/mcp-preview/d4ba7fa8-fe4f-4a86-88b3-c4205e2ed052.mp3',
 exponents:'https://storage.googleapis.com/adm--audio-playback--7d--public/mcp-preview/2661a4e3-1008-49a2-aef7-9112409596fe.mp3',
 factor:'https://storage.googleapis.com/adm--audio-playback--7d--public/mcp-preview/4e768d4b-03fa-42a8-b3de-30baec832be3.mp3',
 fractions:'https://storage.googleapis.com/adm--audio-playback--7d--public/mcp-preview/cc1ef377-a5df-4e0a-94a4-4ba0a16f9cdb.mp3',
 equations:'https://storage.googleapis.com/adm--audio-playback--7d--public/mcp-preview/49191d06-e001-4b27-82e4-2ed902b2a852.mp3',
 simultaneous:'https://storage.googleapis.com/adm--audio-playback--7d--public/mcp-preview/b67c5ee1-c110-4145-b24c-71ed6b6b8a7d.mp3',
 inequality:'https://storage.googleapis.com/adm--audio-playback--7d--public/mcp-preview/914c1b0b-4aee-444c-8918-d9224f34e95a.mp3',
 word:'https://storage.googleapis.com/adm--audio-playback--7d--public/mcp-preview/19c1ad38-1120-48b2-893d-88a6db885656.mp3',
 exam:'https://storage.googleapis.com/adm--audio-playback--7d--public/mcp-preview/6eba1960-3064-41ab-9519-a902ca281104.mp3'
};
const frac=(n,d)=>'<span class="frac"><span class="num">'+n+'</span><span class="den">'+d+'</span></span>';
const cue=(at,caption,html)=>'<div class="cue mathRow" data-at="'+at+'" data-caption="'+caption.replace(/"/g,'&quot;')+'">'+html+'</div>';
const outline=[
 ['Algebra language','Terms, coefficients, constants, like terms and simplification.'],
 ['Expansion','Single brackets, two brackets and sign control.'],
 ['Exponents','Product, quotient, powers, zero and negative exponents.'],
 ['Factorisation','Common factor, squares, trinomials, grouping and cubes.'],
 ['Algebraic fractions','Restrictions, factorise first and cancel factors correctly.'],
 ['Linear equations','Balance, brackets and fractions in equations.'],
 ['Quadratic equations','Factorise, zero-product rule and two solutions.'],
 ['Simultaneous & formulae','Elimination, substitution and changing the subject.'],
 ['Inequalities','Solve ranges and flip the sign after dividing by a negative.'],
 ['Word problems','Translate ordinary language into algebra.'],
 ['Exam Coach','Attempt real exam-style questions, then study the marking guide.']
];
const screens=[
{key:'outline',title:'See the whole journey first',eyebrow:'Lesson roadmap',audio:'intro',
 cues:[
  ['0.00','First, see the whole lesson before you start.','<b>Start with the basics.</b> We build from simple ideas before harder questions.'],
  ['0.30','Then we connect the skills together.','<b>Expressions → equations → exam questions.</b> Each topic feeds the next one.'],
  ['0.66','At the end, you practise like you are in an exam.','<b>Exam Coach:</b> answer first, then study exactly where the marks come from.']
 ],
 body:()=>'<p class="lead">Lateya, you are not expected to know all of this at once. We move through it in small pieces and keep connecting each new idea to something you already understand.</p><div class="outlineGrid">'+outline.map((x,i)=>'<div class="outlineItem"><div class="outNum">'+(i+1)+'</div><div><strong>'+x[0]+'</strong><span class="small">'+x[1]+'</span></div></div>').join('')+'</div><div class="card lav flat"><b>The lesson pattern:</b> listen → watch the maths move → try one → get feedback → use it in an exam question.</div>'},
{key:'language',title:'Make algebra look less scary',eyebrow:'1 • Algebra language',audio:'language',
 cues:[
  ['0.00','A long expression is just a few smaller pieces.','<span class="token tokenFocus">4x²</span> − <span>3x</span> + <span>7</span>'],
  ['0.30','The plus and minus signs separate those pieces into terms.','<span class="token tokenFocus">4x²</span> &nbsp; | &nbsp; <span class="token tokenFocus">−3x</span> &nbsp; | &nbsp; <span class="token tokenFocus">7</span>'],
  ['0.62','Only terms that match exactly can be joined.','<span class="token tokenFocus">5x</span> + <span class="token tokenFocus">2x</span> = 7x'],
  ['0.82','x and x-squared are different kinds of terms.','5x + 2x² <span class="mathNote">cannot be combined</span>']
 ],
 body:()=>'<div class="explainGrid"><div class="explainItem"><b>Term</b>A chunk separated by + or −.</div><div class="explainItem"><b>Coefficient</b>The number sitting in front of a variable.</div><div class="explainItem"><b>Constant</b>A number with no variable attached.</div><div class="explainItem"><b>Like terms</b>Same letters and the same powers.</div></div><div class="why"><b>Think of units:</b> 3 apples + 2 apples = 5 apples. But 3 apples + 2 boxes of apples are not the same unit. That is why x and x² do not combine.</div>',
 quiz:{type:'input',prompt:'Simplify: 8x + 4 − 3x + 9',answers:['5x+13'],hint:'Put the x terms together first. Then put the ordinary numbers together.',explain:'8x−3x=5x and 4+9=13. So the simplified expression is 5x+13.'}},
{key:'expansion',title:'Brackets are just sharing',eyebrow:'2 • Expansion',audio:'expansion',
 cues:[
  ['0.00','Imagine the −2 outside the bracket has to be shared with everything inside.','<span class="token tokenFocus">−2</span>(3x − 5)'],
  ['0.28','First share it with 3x.','(−2)(3x) = <span class="token tokenFocus">−6x</span>'],
  ['0.55','Then share it with −5. Negative times negative becomes positive.','(−2)(−5) = <span class="token tokenFocus">+10</span>'],
  ['0.78','Now put those two results together.','<span class="token tokenFocus">−6x + 10</span>']

async function hashText(v){const data=new TextEncoder().encode(v),digest=await crypto.subtle.digest('SHA-256',data);return [...new Uint8Array(digest)].map(b=>b.toString(16).padStart(2,'0')).join('')}
document.getElementById('gateForm').addEventListener('submit',async e=>{e.preventDefault();const v=document.getElementById('password').value,er=document.getElementById('gateError');er.textContent='';try{if(await hashText(v)===PASS_HASH){sessionStorage.setItem('lateya-studio-access','1');document.getElementById('gate').classList.add('hidden');document.getElementById('app').classList.remove('hidden');render()}else er.textContent='That password is not correct.'}catch(x){er.textContent='Open the lesson in Chrome and try again.'}});
if(sessionStorage.getItem('lateya-studio-access')==='1'){document.getElementById('gate').classList.add('hidden');document.getElementById('app').classList.remove('hidden');render()}
})();
</script>
