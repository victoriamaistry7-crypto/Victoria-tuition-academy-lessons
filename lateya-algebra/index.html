<style>
:root{
 --ink:#18131e;--muted:#766f7d;--line:#e8e1ec;--paper:#fff;--wash:#faf8fc;
 --purple:#6d28d9;--purple2:#8b5cf6;--purple3:#f0eaff;--plum:#32164b;
 --green:#166b45;--greenbg:#eaf8f0;--red:#9b2929;--redbg:#fff0f0;

}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:linear-gradient(#fbf9fd,#f7f4fa);color:var(--ink);line-height:1.55}
button,input{font:inherit}button{cursor:pointer}.hidden{display:none!important}
.gate{position:fixed;inset:0;z-index:9999;display:grid;place-items:center;padding:18px;background:radial-gradient(circle at 75% 18%,rgba(255,255,255,.18),transparent 28%),linear-gradient(145deg,#1b0e25,#48206a 58%,#7c3aed)}
.gateCard{width:min(430px,100%);background:rgba(255,255,255,.98);border-radius:28px;padding:28px;box-shadow:0 28px 90px rgba(0,0,0,.28)}
.micro{font-size:.72rem;font-weight:950;letter-spacing:.14em;text-transform:uppercase;color:var(--purple)}
.gate h1{font-size:2rem;line-height:1.04;letter-spacing:-.035em;margin:.55rem 0 .7rem}
.muted{color:var(--muted)}label{display:block;font-weight:850;margin:.75rem 0 .35rem}
.field{width:100%;min-height:51px;border:1.5px solid #d9d0df;border-radius:14px;padding:12px 14px;font-size:16px;background:#fff;outline:none}.field:focus{border-color:var(--purple2);box-shadow:0 0 0 4px var(--purple3)}
.err{min-height:22px;color:var(--red);font-weight:800;font-size:.86rem;margin:.4rem 0}
.btn{border:0;min-height:47px;border-radius:14px;padding:10px 16px;font-weight:900;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:.16s}.btn:active{transform:scale(.985)}.btn:disabled{opacity:.42;cursor:not-allowed}
.primary{background:linear-gradient(135deg,var(--purple),var(--purple2));color:#fff;box-shadow:0 8px 20px rgba(109,40,217,.21)}.soft{background:#f2edf7;color:#4e246f}.ghost{background:#fff;color:var(--ink);border:1px solid var(--line)}.dark{background:#1f1825;color:#fff}
.app{max-width:1000px;margin:auto;padding:0 13px 130px}
.top{position:sticky;top:0;z-index:50;background:rgba(250,248,252,.92);backdrop-filter:blur(15px);border-bottom:1px solid rgba(230,222,235,.85);padding:9px 0}
.topLine{display:flex;align-items:center;justify-content:space-between;gap:10px}.brand{font-size:.84rem;font-weight:950}.brand span{color:var(--purple)}
.topics{min-height:37px;border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 11px;font-weight:850;color:#504756}
.progressLine{display:flex;align-items:center;gap:8px;margin-top:8px}.track{height:7px;flex:1;background:#e8e1ed;border-radius:99px;overflow:hidden}.fill{height:100%;width:0;background:linear-gradient(90deg,var(--purple),#b38ce8);transition:width .25s}.progressText{font-size:.72rem;font-weight:850;color:var(--muted);white-space:nowrap}
.hero{padding:24px 3px 12px}.eyebrow{display:inline-flex;align-items:center;padding:5px 9px;border-radius:999px;background:#f3edff;color:#55209a;border:1px solid #dfd1f4;font-size:.7rem;font-weight:950;letter-spacing:.08em;text-transform:uppercase}
h1{font-size:clamp(1.85rem,6vw,3.35rem);line-height:1.04;letter-spacing:-.04em;margin:.65rem 0 .55rem}h2{font-size:clamp(1.35rem,4.5vw,2.15rem);line-height:1.1;margin:.45rem 0 .9rem}h3{font-size:1.03rem;margin:0 0 .4rem}.lead{font-size:1.02rem;color:#554d5d;max-width:760px}
.introHero{background:linear-gradient(145deg,#fff,#faf6ff);border:1px solid var(--line);border-radius:26px;padding:22px;margin:12px 0;box-shadow:var(--shadow)}
.introHero h1{font-size:clamp(1.75rem,6vw,2.8rem);max-width:700px}.introHero .lead{font-size:.98rem;max-width:720px}
.introNote{margin-top:15px;padding-top:14px;border-top:1px solid var(--line);font-size:.9rem;color:var(--muted)}
.card{background:#fff;border:1px solid var(--line);border-radius:22px;padding:17px;margin:13px 0;box-shadow:var(--shadow)}.flat{box-shadow:none}.lav{background:#fbf8ff;border-color:#e1d6f0}
.grid2{display:grid;gap:12px}.explainGrid{display:grid;gap:9px}.explain{border:1px solid var(--line);border-radius:16px;padding:13px;background:#fff}.explain b{display:block;margin-bottom:3px}.small{font-size:.8rem;color:var(--muted)}
.tutor{background:linear-gradient(145deg,#22162d,#40205c 60%,#633195);color:#fff;border-radius:25px;padding:16px;margin:13px 0;box-shadow:0 20px 50px rgba(51,24,73,.22)}
.tutorHead{display:flex;align-items:center;gap:11px}.avatar{width:47px;height:47px;border-radius:50%;background:#fff;color:#572099;display:grid;place-items:center;font-weight:950;box-shadow:inset 0 0 0 1px rgba(255,255,255,.7)}.tutorInfo{flex:1;min-width:0}.tutorName{font-size:.9rem;font-weight:950}.tutorSub{font-size:.75rem;color:#d9cce3}
.wave{display:flex;gap:3px;align-items:center;height:24px}.wave i{width:3px;height:8px;border-radius:10px;background:#cbb7dc;display:block}.tutor.playing .wave i{animation:wave .65s ease-in-out infinite alternate}.tutor.playing .wave i:nth-child(2){animation-delay:.1s}.tutor.playing .wave i:nth-child(3){animation-delay:.2s}.tutor.playing .wave i:nth-child(4){animation-delay:.3s}
@keyframes wave{to{height:22px;background:#fff}}
.audioControls{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}.audioBtn{min-height:47px;border-radius:14px;border:1px solid rgba(255,255,255,.16);background:rgba(255,255,255,.10);color:#fff;font-weight:900}.audioBtn.main{background:#fff;color:#3d1d57}.audioStatus{margin-top:8px;font-size:.76rem;color:#d8cce0}.stepCounter{font-size:.72rem;color:#cdbed7;margin-top:2px}
.board{background:#fff;border:1px solid var(--line);border-radius:23px;padding:17px;margin:13px 0;box-shadow:var(--shadow);overflow:hidden}.boardTitle{font-size:.71rem;letter-spacing:.1em;text-transform:uppercase;font-weight:950;color:#766d7d;margin-bottom:10px}
.teachStep{opacity:.25;transform:translateY(8px);filter:grayscale(.45);transition:opacity .32s,transform .32s,filter .32s,background .32s,border-color .32s}.teachStep.active{opacity:1;transform:none;filter:none}.teachStep.done{opacity:.66;transform:none;filter:none}
.mathLine{font-family:"Cambria Math","STIX Two Math",Georgia,serif;font-size:clamp(1.18rem,4.7vw,1.85rem);line-height:1.38;padding:11px 12px;border-radius:14px;border:1px solid transparent;margin:7px 0;overflow-wrap:anywhere}.mathLine.active{background:#f7f1ff;border-color:#dac7f2}
.stepCaption{font-family:Inter,system-ui,sans-serif;font-size:.8rem;color:var(--muted);font-weight:650;margin-top:3px}
.frac{display:inline-flex;vertical-align:middle;flex-direction:column;align-items:stretch;text-align:center;line-height:1.05;margin:0 .12em;min-width:2.15em}.frac .num{border-bottom:1.7px solid currentColor;padding:0 .18em .12em}.frac .den{padding:.12em .18em 0}.cancel{text-decoration:line-through;text-decoration-thickness:2px;text-decoration-color:#8b5cf6}
.focus{display:inline-block;background:#eadcff;color:#4d1f73;border-radius:8px;padding:0 4px}
.why{border-left:4px solid var(--purple);background:#faf6ff;border-radius:13px;padding:12px 14px;margin:12px 0}
.practice{background:#fff;border:1.5px solid #d8c6ed;border-radius:21px;padding:15px;margin:15px 0}.practiceHead{display:flex;align-items:center;justify-content:space-between;gap:8px}.tag{font-size:.7rem;letter-spacing:.08em;text-transform:uppercase;font-weight:950;color:#5a2297;background:#f1e8ff;border-radius:999px;padding:5px 8px}.question{font-size:1rem;font-weight:850;margin:12px 0}.choices{display:grid;gap:8px}.choice{width:100%;min-height:49px;text-align:left;border:1.5px solid var(--line);border-radius:13px;background:#fff;padding:11px 12px;font-weight:700}.choice.correct{background:var(--greenbg);border-color:#82cda2;color:var(--green)}.choice.wrong{background:var(--redbg);border-color:#edb0b0;color:var(--red)}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.feedback{display:none;margin-top:10px;padding:11px 12px;border-radius:12px;font-weight:700}.feedback.show{display:block}.feedback.good{background:var(--greenbg);color:var(--green)}.feedback.bad{background:var(--redbg);color:var(--red)}.feedback.hint{background:var(--amberbg);color:var(--amber)}

@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}

</head>

<section id="gate" class="gate">
 <div class="gateCard">
  <div class="micro">Victoria Tuition Academy</div>
  <h1>Lateya’s Grade 10 Algebra Tutor</h1>
  <p class="muted">A guided lesson that teaches one step at a time and then practises it with you.</p>
  <form id="gateForm">
   <label for="password">Lesson password</label>
   <input id="password" class="field" type="password" autocomplete="current-password" placeholder="Enter password" required>

  </form>
 </div>
</section>

  </header>
  <main id="main"></main>
 </div>
 <div id="drawer" class="drawer" aria-hidden="true"><div class="drawerPanel"><div class="drawerHead"><div><div class="micro">Lesson map</div><h3 style="margin-top:3px">Choose a section</h3></div><button id="closeDrawer" class="btn ghost" type="button">Close</button></div><div id="drawerList" class="drawerList"></div></div></div>

</div>

function norm(v){return String(v||'').toLowerCase().replace(/\s+/g,'').replace(/−/g,'-').replace(/≥/g,'>=').replace(/≤/g,'<=')}
function matches(v,a){const n=norm(v);return a.some(x=>norm(x)===n)}

function stopPlayer(){
 player.token++;
 if(player.audio){player.audio.pause();player.audio.src='';player.audio=null}
 player.playing=false;player.index=0;player.screen=null;
}
function render(){
 stopPlayer();
 const s=screens[state.i],pct=Math.round(state.i/(screens.length-1)*100);
 fill.style.width=pct+'%';progressText.textContent=(state.i+1)+' of '+screens.length;navMid.textContent=s.eyebrow;backBtn.disabled=state.i===0;nextBtn.textContent=state.i===screens.length-1?'Start again ↺':'Continue →';
 let body=s.exam?examHTML():s.report?reportHTML():s.body();
 if(s.intro){main.innerHTML=body+tutorHTML(s)}else{main.innerHTML='<section class="hero"><span class="eyebrow">'+s.eyebrow+'</span><h1>'+s.title+'</h1></section>'+tutorHTML(s)+body+(s.quiz?practiceHTML(s.quiz):'')}
 wireTutor(s);wirePractice(s);if(s.exam)wireExam();buildDrawer();save();window.scrollTo({top:0,behavior:'smooth'});
}
function setVisualStep(i,s){
 const steps=[...document.querySelectorAll('.teachStep')];
 steps.forEach((el,j)=>{el.classList.toggle('active',j===i);el.classList.toggle('done',j<i)});
 const sc=document.getElementById('stepCounter');if(sc)sc.textContent='Step '+(i+1)+' of '+s.segments.length;
}
function wireTutor(s){
 if(!s.segments)return;
 const tutor=document.getElementById('tutor'),play=document.getElementById('playAudio'),restart=document.getElementById('restartAudio'),status=document.getElementById('audioStatus');
 player.screen=s;player.index=0;player.playing=false;setVisualStep(0,s);
 const preload=i=>{if(s.segments[i+1]){const a=new Audio();a.preload='auto';a.src=s.segments[i+1].u}}
 function playStep(i,token){
  if(token!==player.token||!s.segments[i]){player.playing=false;tutor.classList.remove('playing');play.textContent='▶ Play again';status.textContent='Explanation finished. Now try the question below.';return}
  player.index=i;setVisualStep(i,s);status.textContent=s.segments[i].caption;preload(i);
  const a=new Audio(s.segments[i].u);a.preload='auto';player.audio=a;
  a.addEventListener('ended',()=>{if(token===player.token&&player.playing)playStep(i+1,token)},{once:true});
  a.addEventListener('error',()=>{if(token===player.token){player.playing=false;tutor.classList.remove('playing');play.textContent='▶ Continue';status.textContent='That audio step could not load. Tap Continue to retry.'}},{once:true});
  a.play().catch(()=>{if(token===player.token){player.playing=false;tutor.classList.remove('playing');play.textContent='▶ Start teaching';status.textContent='Open this lesson in Chrome and tap Start teaching.'}});
 }
 play.addEventListener('click',()=>{
  if(player.playing&&player.audio){player.audio.pause();player.playing=false;tutor.classList.remove('playing');play.textContent='▶ Continue';status.textContent='Paused at this exact teaching step.';return}
  if(player.audio&&player.audio.currentTime>0&&player.audio.paused&&!player.audio.ended){player.audio.play();player.playing=true;tutor.classList.add('playing');play.textContent='⏸ Pause';status.textContent=s.segments[player.index].caption;return}
  player.token++;const t=player.token;player.playing=true;tutor.classList.add('playing');play.textContent='⏸ Pause';playStep(player.index,t);
 });
 restart.addEventListener('click',()=>{
  player.token++;if(player.audio)player.audio.pause();player.audio=null;player.index=0;player.playing=true;setVisualStep(0,s);tutor.classList.add('playing');play.textContent='⏸ Pause';const t=player.token;playStep(0,t);
 });
}
function wirePractice(s){
 if(!s.quiz)return;const q=s.quiz,fb=document.getElementById('practiceFeedback'),saved=state.checks[s.key];
 if(q.type==='mcq'){const bs=[...document.querySelectorAll('.choice')];if(saved){bs.forEach((b,i)=>{b.disabled=true;if(i===q.answer)b.classList.add('correct');if(i===saved.choice&&i!==q.answer)b.classList.add('wrong')});fb.className='feedback show '+(saved.correct?'good':'bad');fb.textContent=(saved.correct?'Correct. ':'Not quite. ')+q.explain}bs.forEach((b,i)=>b.addEventListener('click',()=>{const ok=i===q.answer;state.checks[s.key]={correct:ok,choice:i};bs.forEach((x,j)=>{x.disabled=true;if(j===q.answer)x.classList.add('correct');if(j===i&&!ok)x.classList.add('wrong')});fb.className='feedback show '+(ok?'good':'bad');fb.textContent=(ok?'Correct. ':'Not quite. ')+q.explain;save()}))}
 else{const input=document.getElementById('practiceInput'),check=document.getElementById('checkPractice'),hint=document.getElementById('hintPractice');if(saved){input.value=saved.value||'';input.disabled=true;check.disabled=true;hint.disabled=true;fb.className='feedback show '+(saved.correct?'good':'bad');fb.textContent=(saved.correct?'Correct. ':'Not quite. ')+q.explain}check.addEventListener('click',()=>{if(!input.value.trim()){fb.className='feedback show hint';fb.textContent='Type an answer first.';return}const ok=matches(input.value,q.answers);state.checks[s.key]={correct:ok,value:input.value};input.disabled=true;check.disabled=true;hint.disabled=true;fb.className='feedback show '+(ok?'good':'bad');fb.textContent=(ok?'Correct. ':'Not quite. ')+q.explain;save()});hint.addEventListener('click',()=>{fb.className='feedback show hint';fb.textContent='Hint: '+q.hint})}
}
function wireExam(){
 document.querySelectorAll('.exam').forEach(box=>{const id=box.dataset.exam,e=exams.find(x=>x.id===id),input=box.querySelector('.examInput'),submit=box.querySelector('.submitExam'),reveal=box.querySelector('.revealExam'),fb=box.querySelector('.feedback'),sol=box.querySelector('.solution');submit.addEventListener('click',()=>{if(!input.value.trim()){fb.className='feedback show hint';fb.textContent='Attempt the question on paper first, then type your final answer.';return}const ok=matches(input.value,e.answers);state.exams[id]={submitted:true,correct:ok,value:input.value};input.disabled=true;submit.disabled=true;reveal.disabled=false;fb.className='feedback show '+(ok?'good':'bad');fb.textContent=ok?'Final answer correct. Open the memo and compare the working, not just the answer.':'The final answer is not correct yet. Open the memo and find the first step where your working differs.';save()});reveal.addEventListener('click',()=>{sol.classList.add('show');reveal.disabled=true;sol.scrollIntoView({behavior:'smooth',block:'start'})})})
}
function buildDrawer(){const d=document.getElementById('drawerList');d.innerHTML=screens.map((s,i)=>'<button class="drawerItem '+(i===state.i?'active':'')+'" data-jump="'+i+'" type="button"><span class="drawerNum">'+(i+1)+'</span><span><b>'+s.title+'</b><br><span class="small">'+s.eyebrow+'</span></span></button>').join('');d.querySelectorAll('.drawerItem').forEach(b=>b.addEventListener('click',()=>{state.i=Number(b.dataset.jump);closeDrawer();render()}))}
function openDrawer(){document.getElementById('drawer').classList.add('show');document.getElementById('drawer').setAttribute('aria-hidden','false')}
function closeDrawer(){document.getElementById('drawer').classList.remove('show');document.getElementById('drawer').setAttribute('aria-hidden','true')}
document.getElementById('topicsBtn').addEventListener('click',openDrawer);document.getElementById('closeDrawer').addEventListener('click',closeDrawer);document.getElementById('drawer').addEventListener('click',e=>{if(e.target.id==='drawer')closeDrawer()});
backBtn.addEventListener('click',()=>{if(state.i>0){state.i--;render()}});nextBtn.addEventListener('click',()=>{state.i=state.i===screens.length-1?0:state.i+1;render()});
async function hashText(v){const data=new TextEncoder().encode(v),digest=await crypto.subtle.digest('SHA-256',data);return [...new Uint8Array(digest)].map(b=>b.toString(16).padStart(2,'0')).join('')}
document.getElementById('gateForm').addEventListener('submit',async e=>{e.preventDefault();const v=document.getElementById('password').value,er=document.getElementById('gateError');er.textContent='';try{if(await hashText(v)===PASS_HASH){sessionStorage.setItem('lateya-v5-access','1');document.getElementById('gate').classList.add('hidden');document.getElementById('app').classList.remove('hidden');render()}else er.textContent='That password is not correct.'}catch(x){er.textContent='Open the lesson in Chrome and try again.'}});
if(sessionStorage.getItem('lateya-v5-access')==='1'){document.getElementById('gate').classList.add('hidden');document.getElementById('app').classList.remove('hidden');render()}
})();
</script>
