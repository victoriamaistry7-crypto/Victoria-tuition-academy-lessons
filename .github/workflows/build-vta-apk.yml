name: Build VTA Supabase APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'android-app/**'
      - '.github/workflows/build-vta-apk.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - run: gradle -p android-app assembleDebug --no-daemon
      - run: cp android-app/app/build/outputs/apk/debug/app-debug.apk VTA-Student-Portal-Cloud.apk
      - uses: actions/upload-artifact@v4
        with:
          name: VTA-Student-Portal-Cloud-APK
          path: VTA-Student-Portal-Cloud.apk
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete vta-cloud-latest --cleanup-tag --yes || true
          gh release create vta-cloud-latest VTA-Student-Portal-Cloud.apk \
            --title "VTA Student Portal — Supabase Cloud" \
            --notes "Native Android VTA portal using Supabase shared backend. Cross-device accounts, bookings, messages, schedule, private resources, finance and live availability."
