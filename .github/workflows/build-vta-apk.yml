name: Build VTA Student Portal APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'android-app/**'
      - '.github/workflows/build-vta-apk.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - run: gradle -p android-app assembleDebug --no-daemon
      - run: cp android-app/app/build/outputs/apk/debug/app-debug.apk VTA-Student-Portal-Native.apk
      - uses: actions/upload-artifact@v4
        with:
          name: VTA-Student-Portal-Native-APK
          path: VTA-Student-Portal-Native.apk
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete vta-student-portal-native --cleanup-tag --yes || true
          gh release create vta-student-portal-native VTA-Student-Portal-Native.apk \
            --title "VTA Student Portal — Native Android App" \
            --notes "Separate native Android portal app. Opens with role selection and username/password login. No booking access-code screen and no website wrapper."
