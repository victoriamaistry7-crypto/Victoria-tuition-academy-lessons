name: Build Victoria Tuition Academy APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'android-app/**'
      - 'booking/index.html'
      - '.github/workflows/build-vta-apk.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: gradle -p android-app assembleDebug --no-daemon

      - name: Prepare APK
        run: cp android-app/app/build/outputs/apk/debug/app-debug.apk Victoria-Tuition-Academy.apk

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Victoria-Tuition-Academy-APK
          path: Victoria-Tuition-Academy.apk

      - name: Publish latest APK release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete vta-android-latest --cleanup-tag --yes || true
          gh release create vta-android-latest Victoria-Tuition-Academy.apk \
            --title "Victoria Tuition Academy Android App" \
            --notes "Personal install build of the Victoria Tuition Academy booking app. This APK loads the live booking portal so booking-form updates do not require reinstalling the app."
