name: Build Victoria Tuition Academy APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'android-app/**'
      - '.github/workflows/build-vta-apk.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - run: gradle -p android-app assembleDebug --no-daemon
      - run: cp android-app/app/build/outputs/apk/debug/app-debug.apk Victoria-Tuition-Academy.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Victoria-Tuition-Academy-APK
          path: Victoria-Tuition-Academy.apk
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete vta-native-latest --cleanup-tag --yes || true
          gh release create vta-native-latest Victoria-Tuition-Academy.apk \
            --title "Victoria Tuition Academy Native Android App" \
            --notes "Native Android student/admin portal. No website wrapper."
