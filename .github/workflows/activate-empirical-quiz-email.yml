name: Activate quiz submission email
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/activate-empirical-quiz-email.yml'
jobs:
  activate:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger FormSubmit activation
        run: |
          curl -L -sS -X POST             -A "Mozilla/5.0"             -F "name=Victoria Tuition Academy Quiz Setup"             -F "message=One-time activation request for the Empirical Formula Quiz submission form."             -F "_subject=Activate Empirical Formula Quiz submissions"             https://formsubmit.co/victoriamaistry18@gmail.com             -o /tmp/formsubmit-response.html
          echo "FormSubmit request sent."
